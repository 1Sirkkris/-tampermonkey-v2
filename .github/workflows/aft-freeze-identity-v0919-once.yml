name: one-shot freeze AFT userscript identity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aft-freeze-identity-v0919-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
          node --check AFT_Edit_SKU_Move.user.js
          grep -q '@name         MAIN v0.9.17 AFT Edit/SKU/Move master' AFT_Edit_SKU_Move.user.js
          grep -q '@name:en      MAIN v0.9.17 AFT Edit/SKU/Move master' AFT_Edit_SKU_Move.user.js
          grep -q '@version      0.9.19' AFT_Edit_SKU_Move.user.js
          grep -q "const VERSION = '0.9.19';" AFT_Edit_SKU_Move.user.js
          git diff --check
      - name: Publish main and sync work laptop pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/aft-freeze-identity-v0919-once.yml
          git add AFT_Edit_SKU_Move.user.js .github/workflows/aft-freeze-identity-v0919-once.yml
          git commit -m "fix: freeze AFT userscript identity for updates"
          git push origin main

          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:AFT_Edit_SKU_Move.user.js > 02_AFT_Edit-SKU-Move.txt
          cp 02_AFT_Edit-SKU-Move.txt /tmp/aft-edit-sku-move.js
          node --check /tmp/aft-edit-sku-move.js
          grep -q '@name         MAIN v0.9.17 AFT Edit/SKU/Move master' 02_AFT_Edit-SKU-Move.txt
          grep -q '@version      0.9.19' 02_AFT_Edit-SKU-Move.txt
          git add 02_AFT_Edit-SKU-Move.txt
          git commit -m "deploy: sync AFT Edit SKU Move v0.9.19" || true
          git push origin work-laptop-pack
