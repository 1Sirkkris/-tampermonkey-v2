name: one-shot AFT identity repair v0.9.24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aft-identity-repair-v0924-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair identity and validate pre-publish gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('AFT_Edit_SKU_Move.user.js')
          s = p.read_text()

          expected_namespace = '// @namespace    https://github.com/1Sirkkris'
          expected_update = '// @updateURL    https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js'
          expected_download = '// @downloadURL  https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js'
          visible_name = '// @name:en      MAIN AFT Edit/SKU/Move master'

          for line, label in [
              (expected_namespace, '@namespace'),
              (expected_update, '@updateURL'),
              (expected_download, '@downloadURL'),
              (visible_name, '@name:en'),
          ]:
              if s.count(line) != 1:
                  raise SystemExit(f'{label} mismatch before repair')

          bad_name = '// @name         MAIN v0.9.23 AFT Edit/SKU/Move master'
          frozen_name = '// @name         MAIN v0.9.17 AFT Edit/SKU/Move master'
          if s.count(bad_name) != 1:
              raise SystemExit('Unexpected current @name; refusing identity repair')
          s = s.replace(bad_name, frozen_name, 1)

          if s.count('// @version      0.9.23') != 1:
              raise SystemExit('Unexpected current @version')
          s = s.replace('// @version      0.9.23', '// @version      0.9.24', 1)

          if s.count("const VERSION = '0.9.23';") != 1:
              raise SystemExit('Unexpected internal VERSION')
          s = s.replace("const VERSION = '0.9.23';", "const VERSION = '0.9.24';", 1)

          p.write_text(s)

          r = Path('README.md')
          rs = r.read_text()
          rs, n = re.subn(r'(\| AFT Edit/SKU/Move \| )0\.9\.23( \| \[Open\])', r'\g<1>0.9.24\g<2>', rs, count=1)
          if n != 1:
              raise SystemExit('README AFT row mismatch')
          r.write_text(rs)

          # Mandatory identity/version gate.
          final = p.read_text()
          checks = {
              'frozen @name': frozen_name,
              '@namespace': expected_namespace,
              '@updateURL': expected_update,
              '@downloadURL': expected_download,
              'version-free @name:en': visible_name,
              '@version': '// @version      0.9.24',
              'internal VERSION': "const VERSION = '0.9.24';",
              'runtime stamp': "registerRuntimeVersion('AFT', VERSION);",
          }
          for label, needle in checks.items():
              if final.count(needle) != 1:
                  raise SystemExit(f'Pre-publish gate failed: {label}')
          if 'MAIN v0.9.23 AFT Edit/SKU/Move master' in final:
              raise SystemExit('Rejected identity still present')
          PY

          node --check AFT_Edit_SKU_Move.user.js
          git diff --check
          git diff -- AFT_Edit_SKU_Move.user.js README.md

      - name: Publish main and sync work-laptop-pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp AFT_Edit_SKU_Move.user.js /tmp/AFT_Edit_SKU_Move.user.js
          rm .github/workflows/aft-identity-repair-v0924-once.yml
          git add AFT_Edit_SKU_Move.user.js README.md .github/workflows/aft-identity-repair-v0924-once.yml
          git commit -m "fix: restore immutable AFT userscript identity"
          git push origin main

          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b aft-identity-repair-pack "$worktree" origin/work-laptop-pack
          cp /tmp/AFT_Edit_SKU_Move.user.js "$worktree/02_AFT_Edit-SKU-Move.txt"
          sed -i -E 's/^02 AFT Edit-SKU-Move v.*/02 AFT Edit-SKU-Move v0.9.24/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          cp "$worktree/02_AFT_Edit-SKU-Move.txt" /tmp/aft-check.js
          node --check /tmp/aft-check.js
          grep -q '^// @name         MAIN v0.9.17 AFT Edit/SKU/Move master$' "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q '^// @namespace    https://github.com/1Sirkkris$' "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q '^// @version      0.9.24$' "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q "const VERSION = '0.9.24';" "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q "registerRuntimeVersion('AFT', VERSION);" "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q '^// @updateURL    https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js$' "$worktree/02_AFT_Edit-SKU-Move.txt"
          grep -q '^// @downloadURL  https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js$' "$worktree/02_AFT_Edit-SKU-Move.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 02_AFT_Edit-SKU-Move.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "deploy: sync AFT v0.9.24 identity repair" || true
          git -C "$worktree" push origin HEAD:work-laptop-pack
