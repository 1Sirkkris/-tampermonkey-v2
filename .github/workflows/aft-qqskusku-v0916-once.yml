name: one-shot QQSkuSku batch queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aft-qqskusku-v0916-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate QQSkuSku
        shell: bash
        run: |
          sed -i "s/^'''    parseEachQueue/r'''    parseEachQueue/" .github/qqskusku-v0916-patch.py
          python3 .github/qqskusku-v0916-patch.py
          node --check AFT_Edit_SKU_Move.user.js
          grep -q '@version      0.9.16' AFT_Edit_SKU_Move.user.js
          grep -q 'QQSkuSku queue' AFT_Edit_SKU_Move.user.js
          grep -q 'maxRecoveries: 2' AFT_Edit_SKU_Move.user.js
          grep -q 'FAILED (' AFT_Edit_SKU_Move.user.js
      - name: Publish main and sync work laptop pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/aft-qqskusku-v0916-once.yml .github/qqskusku-v0916-patch.py
          git add AFT_Edit_SKU_Move.user.js .github/workflows/aft-qqskusku-v0916-once.yml .github/qqskusku-v0916-patch.py
          git commit -m "feat: add QQSkuSku batch queue"
          git push origin main

          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:AFT_Edit_SKU_Move.user.js > 02_AFT_Edit-SKU-Move.txt
          cp 02_AFT_Edit-SKU-Move.txt /tmp/aft-edit-sku-move.js
          node --check /tmp/aft-edit-sku-move.js
          grep -q '@version      0.9.16' 02_AFT_Edit-SKU-Move.txt
          git add 02_AFT_Edit-SKU-Move.txt
          git commit -m "deploy: sync AFT Edit SKU Move v0.9.16" || true
          git push origin work-laptop-pack
