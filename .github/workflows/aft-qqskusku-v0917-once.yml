name: one-shot QQSkuSku queue safety

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aft-qqskusku-v0917-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AFT_Edit_SKU_Move.user.js')
          s = p.read_text()
          replacements = [
              ('// @name         MAIN v0.9.16 AFT Edit/SKU/Move master', '// @name         MAIN v0.9.17 AFT Edit/SKU/Move master'),
              ('// @name:en      MAIN v0.9.16 AFT Edit/SKU/Move master', '// @name:en      MAIN v0.9.17 AFT Edit/SKU/Move master'),
              ('// @version      0.9.16', '// @version      0.9.17'),
              ("const VERSION = '0.9.16';", "const VERSION = '0.9.17';"),
              (
                  '          session = await this.resetSkuWorkflow(objectId, `Attempt ${attempt} complete`, false);',
                  """          session = options.allowReload === false
            ? await this.restoreSkuBatchReady()
            : await this.resetSkuWorkflow(objectId, `Attempt ${attempt} complete`, false);"""
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected patch target missing: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check AFT_Edit_SKU_Move.user.js
          grep -q '@version      0.9.17' AFT_Edit_SKU_Move.user.js
          grep -q 'options.allowReload === false' AFT_Edit_SKU_Move.user.js
          grep -q 'QQSkuSku queue' AFT_Edit_SKU_Move.user.js
          git diff --check
      - name: Publish main and sync work laptop pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/aft-qqskusku-v0917-once.yml
          git add AFT_Edit_SKU_Move.user.js .github/workflows/aft-qqskusku-v0917-once.yml
          git commit -m "fix: keep QQSkuSku queue alive between SKUs"
          git push origin main

          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:AFT_Edit_SKU_Move.user.js > 02_AFT_Edit-SKU-Move.txt
          cp 02_AFT_Edit-SKU-Move.txt /tmp/aft-edit-sku-move.js
          node --check /tmp/aft-edit-sku-move.js
          grep -q '@version      0.9.17' 02_AFT_Edit-SKU-Move.txt
          git add 02_AFT_Edit-SKU-Move.txt
          git commit -m "deploy: sync AFT Edit SKU Move v0.9.17" || true
          git push origin work-laptop-pack
