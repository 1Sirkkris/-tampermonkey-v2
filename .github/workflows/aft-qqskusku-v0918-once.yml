name: one-shot QQSkuSku queue highlights

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aft-qqskusku-v0918-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        shell: bash
        run: |
          python3 .github/qqskusku-v0918-patch.py
          node --check AFT_Edit_SKU_Move.user.js
          grep -q '@version      0.9.18' AFT_Edit_SKU_Move.user.js
          grep -q 'data-sku-batch-progress' AFT_Edit_SKU_Move.user.js
          grep -q '▶ RUNNING' AFT_Edit_SKU_Move.user.js
          grep -q '✓ DONE' AFT_Edit_SKU_Move.user.js
          grep -q '! ERROR' AFT_Edit_SKU_Move.user.js
          grep -q '— 0 QTY' AFT_Edit_SKU_Move.user.js
          git diff --check
      - name: Publish main and sync work laptop pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/aft-qqskusku-v0918-once.yml .github/qqskusku-v0918-patch.py
          git add AFT_Edit_SKU_Move.user.js .github/workflows/aft-qqskusku-v0918-once.yml .github/qqskusku-v0918-patch.py
          git commit -m "ui: highlight QQSkuSku queue progress"
          git push origin main

          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:AFT_Edit_SKU_Move.user.js > 02_AFT_Edit-SKU-Move.txt
          cp 02_AFT_Edit-SKU-Move.txt /tmp/aft-edit-sku-move.js
          node --check /tmp/aft-edit-sku-move.js
          grep -q '@version      0.9.18' 02_AFT_Edit-SKU-Move.txt
          git add 02_AFT_Edit-SKU-Move.txt
          git commit -m "deploy: sync AFT Edit SKU Move v0.9.18" || true
          git push origin work-laptop-pack
