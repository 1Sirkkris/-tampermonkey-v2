name: Apply AFT SKU recovery patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aft-recovery-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped AFT patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AFT_Edit_SKU_Move.user.js')
          s = path.read_text(encoding='utf-8')

          replacements = [
              ("// @version      0.9.25", "// @version      0.9.26"),
              ("const VERSION = '0.9.25';", "const VERSION = '0.9.26';"),
              ("this.status(`RECOVERED ✓ • ${sku} failed • ready`);\n                return true;",
               "this.status(`RECOVERED ✓ • ${sku} • rechecking quantity`);\n                return snap;"),
              ("await this.recoverSkuBackendError(objectId, meta.sku, attempt);\n            return;",
               "session = await this.recoverSkuBackendError(objectId, meta.sku, attempt);\n            if (!session) return;\n            continue;"),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          guard = "if (attempt > 50) throw new Error('Stopped after 50 SKU attempts');"
          if guard not in s:
              raise SystemExit('50-attempt SKU guardrail missing')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check AFT_Edit_SKU_Move.user.js
          git diff --check
          grep -Fq "// @version      0.9.26" AFT_Edit_SKU_Move.user.js
          grep -Fq "const VERSION = '0.9.26';" AFT_Edit_SKU_Move.user.js
          grep -Fq "if (attempt > 50) throw new Error('Stopped after 50 SKU attempts');" AFT_Edit_SKU_Move.user.js
          grep -Fq 'rechecking quantity' AFT_Edit_SKU_Move.user.js
          grep -Fq 'session = await this.recoverSkuBackendError(objectId, meta.sku, attempt);' AFT_Edit_SKU_Move.user.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aft-recovery-patch.yml
          git add AFT_Edit_SKU_Move.user.js
          git commit -m "fix(aft): retry SKU after backend recovery"
          git push origin HEAD:main
