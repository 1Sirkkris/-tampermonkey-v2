name: Apply Core MADCAT keepalive

on:
  push:
    paths:
      - .github/workflows/apply-core-madcat-keepalive-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and publish Core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python .github/apply_core_madcat_keepalive_once.py FCR_Data_Core.user.js README.md
          node --check FCR_Data_Core.user.js
          grep -q '@version      0.2.15' FCR_Data_Core.user.js
          grep -q 'fcrMadcatKeepalive' FCR_Data_Core.user.js
          grep -q 'history-fallback-auth' FCR_Data_Core.user.js
          git diff --check
          git rm .github/workflows/apply-core-madcat-keepalive-once.yml .github/apply_core_madcat_keepalive_once.py
          git add FCR_Data_Core.user.js README.md
          git diff --cached --check
          git commit -m "feat(core): keep Item Measurement MADCAT auth warm"
          git push origin HEAD:main

      - name: Sync work-laptop pack
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b core-keepalive-pack "$worktree" origin/work-laptop-pack
          git show origin/main:FCR_Data_Core.user.js > "$worktree/03_FCR_Data_Core.txt"
          cp "$worktree/03_FCR_Data_Core.txt" /tmp/fcr-core-check.js
          node --check /tmp/fcr-core-check.js
          sed -i 's/^03 FCR Data Core v0\.2\.14$/03 FCR Data Core v0.2.15/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          grep -q '@version      0.2.15' "$worktree/03_FCR_Data_Core.txt"
          grep -q '^03 FCR Data Core v0.2.15$' "$worktree/WORK_LAPTOP_INSTALL.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 03_FCR_Data_Core.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "sync: FCR Data Core v0.2.15"
          git -C "$worktree" push origin HEAD:work-laptop-pack
