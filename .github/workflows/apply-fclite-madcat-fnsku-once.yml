name: Apply FC-Lite MADCAT fix
on:
  push:
    paths:
      - .github/workflows/apply-fclite-madcat-fnsku-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('FC_Lite.user.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              if s.count(old)!=1: raise SystemExit(f'{label}: {s.count(old)} matches')
              s=s.replace(old,new,1)
          once('// @name        TEST v0.1.61 FC-Lite — Strict Bin + 30-Day MADCAT','// @name        TEST v0.1.62 FC-Lite — MADCAT FNSKU Fix','name')
          once('// @version      0.1.61','// @version      0.1.62','version')
          once("const VERSION = '0.1.61';","const VERSION = '0.1.62';",'runtime')
          once("""      registerRowAliases(row, rawScan, product);
      checkMadcat(row, product.fnsku, false, false);

      const matches = matchContainer(product, rawScan);
      const found = matches.length > 0;
      usage(found ? 'item.in' : 'item.out');
""","""      registerRowAliases(row, rawScan, product);

      const matches = matchContainer(product, rawScan);
      const found = matches.length > 0;
      const matchedFnsku = clean(matches.find(match => clean(match?.fnsku))?.fnsku || '');
      const measurementFnsku = matchedFnsku || clean(product?.fnsku || '');
      checkMadcat(row, measurementFnsku, false, false);
      usage(found ? 'item.in' : 'item.out');
""",'fnsku resolution')
          once("""      button.addEventListener('click', () => {
        const needsLogin = /login required/i.test(message);
        checkMadcat(row, row._fcratcMadcatFnsku, true, needsLogin);
      }, { once: true });
""","""      button.addEventListener('click', () => {
        const fnsku = clean(row._fcratcMadcatFnsku);
        checkMadcat(row, fnsku, true, Boolean(fnsku));
      }, { once: true });
""",'error bridge')
          p.write_text(s)
          r=Path('README.md'); t=r.read_text()
          if '| FC-Lite | 0.1.61 |' in t: t=t.replace('| FC-Lite | 0.1.61 |','| FC-Lite | 0.1.62 |',1)
          elif '| FC-Lite | 0.1.60 |' in t: t=t.replace('| FC-Lite | 0.1.60 |','| FC-Lite | 0.1.62 |',1)
          else: raise SystemExit('README row missing')
          r.write_text(t)
          PY
          node --check FC_Lite.user.js
          grep -q 'matchedFnsku' FC_Lite.user.js
          git diff --check
          git rm .github/workflows/apply-fclite-madcat-fnsku-once.yml
          git add FC_Lite.user.js README.md
          git commit -m "fix(fclite): resolve MADCAT FNSKU from tote inventory"
          git push origin HEAD:main
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b fclite-madcat-pack "$worktree" origin/work-laptop-pack
          cp FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          cp "$worktree/05_FC-Lite.txt" /tmp/fclite-check.js
          node --check /tmp/fclite-check.js
          PACK="$worktree/WORK_LAPTOP_INSTALL.txt" python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PACK']); s=p.read_text()
          for old in ('05 FC-Lite v0.1.61','05 FC-Lite v0.1.60','05 FC-Lite v0.1.59'):
              if old in s:
                  p.write_text(s.replace(old,'05 FC-Lite v0.1.62',1)); break
          else: raise SystemExit('pack row missing')
          PY
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 05_FC-Lite.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "sync: FC-Lite v0.1.62"
          git -C "$worktree" push origin HEAD:work-laptop-pack
