name: Apply MADCAT auth fallback once

on:
  push:
    paths:
      - '.github/workflows/apply-madcat-auth-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch FCR Data Core and sync work-laptop pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          # Refuse to patch an unexpected Core revision.
          test "$(git hash-object FCR_Data_Core.user.js)" = "59494f6fc007d82f7f05d031e7c5ae0a831a8720"

          python - <<'PY'
          from pathlib import Path

          path = Path('FCR_Data_Core.user.js')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          once('// @name         TEST v0.2.13 FCR Data Core — Strict Bin + 30-Day MADCAT',
               '// @name         TEST v0.2.14 FCR Data Core — MADCAT Auth Fallback', 'name')
          once('// @version      0.2.13', '// @version      0.2.14', 'metadata version')
          once('// @description  Shared FCR engine with exact-item-only binDescription and fast authenticated 30-day MADCAT checks.',
               '// @description  Strict exact-item binDescription plus 30-day raw MADCAT with automatic Inventory History fallback when measurement auth is unavailable.', 'description')
          once("const VERSION = '0.2.13';", "const VERSION = '0.2.14';", 'runtime version')
          once('    madcatAuthRequired: 0,\n    hazNetwork: 0,',
               '    madcatAuthRequired: 0,\n    madcatHistoryFallback: 0,\n    hazNetwork: 0,', 'fallback stat')

          marker = '  async function fetchRecentMadcat(fnskuValue, force = false) {'
          helper = '''  async function fallbackMadcatToInventoryHistory(fnsku, force = false, reason = 'measurement-auth') {
            stats.madcatHistoryFallback++;
            recordUsage('madcat.fallback.inventory-history');
            const result = await fetchHistory(fnsku, force);
            const history = result?.history || { rows: 0, madcat: false };
            return {
              madcat: history.madcat === true,
              eventsChecked: 0,
              pages: 0,
              source: 'history-fallback-auth',
              windowDays: null,
              fallback: 'inventory-history',
              fallbackReason: reason,
              historyRows: Number(history.rows) || 0
            };
          }

'''
          once(marker, helper + marker, 'fallback helper')

          once("""    const auth = readMeasurementAuth();
            if (!auth) {
              stats.madcatAuthRequired++;
              throw new Error('Measurement login required');
            }
""", """    const auth = readMeasurementAuth();
            if (!auth) {
              stats.madcatAuthRequired++;
              return fallbackMadcatToInventoryHistory(fnsku, force, 'measurement-login-required');
            }
""", 'missing-token fallback')

          once("""    if (inFlight.has(key)) {
              stats.dedupeHits++;
              const data = await inFlight.get(key);
              return { ...data, source: 'dedupe' };
            }
""", """    if (inFlight.has(key)) {
              stats.dedupeHits++;
              try {
                const data = await inFlight.get(key);
                return { ...data, source: 'dedupe' };
              } catch (error) {
                const message = clean(error?.message || error || 'Measurement request failed');
                if (/measurement login required/i.test(message)) {
                  stats.madcatAuthRequired++;
                  return fallbackMadcatToInventoryHistory(fnsku, force, 'measurement-token-expired');
                }
                throw error;
              }
            }
""", 'dedupe token fallback')

          fn_start = text.index(marker)
          fn_end = text.index('\n  async function fetchBinSize(', fn_start)
          section = text[fn_start:fn_end]
          old_tail = """    inFlight.set(key, work);
            try {
              return await work;
            } finally {
              if (inFlight.get(key) === work) inFlight.delete(key);
            }
          }
"""
          new_tail = """    inFlight.set(key, work);
            try {
              return await work;
            } catch (error) {
              const message = clean(error?.message || error || 'Measurement request failed');
              if (/measurement login required/i.test(message)) {
                stats.madcatAuthRequired++;
                return await fallbackMadcatToInventoryHistory(fnsku, force, 'measurement-token-expired');
              }
              throw error;
            } finally {
              if (inFlight.get(key) === work) inFlight.delete(key);
            }
          }
"""
          if section.count(old_tail) != 1:
              raise SystemExit(f'network token fallback: expected 1 match, found {section.count(old_tail)}')
          section = section.replace(old_tail, new_tail, 1)
          text = text[:fn_start] + section + text[fn_end:]

          path.write_text(text)

          readme = Path('README.md')
          r = readme.read_text()
          old = '| FCR Data Core | 0.2.12 |'
          if old not in r:
              raise SystemExit('README Core version row not found')
          readme.write_text(r.replace(old, '| FCR Data Core | 0.2.14 |', 1))
          PY

          node --check FCR_Data_Core.user.js
          grep -q '@version      0.2.14' FCR_Data_Core.user.js
          grep -q 'history-fallback-auth' FCR_Data_Core.user.js
          grep -q 'fallbackMadcatToInventoryHistory' FCR_Data_Core.user.js
          grep -q 'const CACHE_PREFIX = '\''fcr-data-core-v4:'\'';' FCR_Data_Core.user.js
          git diff --check

          # One-shot workflow deletes itself in the resulting production commit.
          git rm .github/workflows/apply-madcat-auth-fallback-once.yml
          git add FCR_Data_Core.user.js README.md
          git diff --cached --check
          git commit -m "fix(core): fallback MADCAT auth failures to inventory history"
          git push origin HEAD:main

          # Keep the work-laptop pack's Core copy aligned with production.
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b madcat-pack-sync "$worktree" origin/work-laptop-pack
          cp FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          PACK="$worktree/WORK_LAPTOP_INSTALL.txt" python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PACK'])
          s = p.read_text()
          old = '03 FCR Data Core v0.2.11'
          if old not in s:
              raise SystemExit('pack manifest Core row not found')
          p.write_text(s.replace(old, '03 FCR Data Core v0.2.14', 1))
          PY
          node --check "$worktree/03_FCR_Data_Core.txt"
          grep -q '@version      0.2.14' "$worktree/03_FCR_Data_Core.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 03_FCR_Data_Core.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "sync: FCR Data Core v0.2.14"
          git -C "$worktree" push origin HEAD:work-laptop-pack
