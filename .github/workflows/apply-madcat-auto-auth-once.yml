name: Apply MADCAT auto auth once

on:
  push:
    paths:
      - '.github/workflows/apply-madcat-auto-auth-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validate publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py

          node --check FCR_Data_Core.user.js
          node --check FCResearch_Master.user.js
          node --check FC_Lite.user.js
          grep -q '@version      0.2.17' FCR_Data_Core.user.js
          grep -q '@version      0.1.25' FCResearch_Master.user.js
          grep -q '@version      0.1.64' FC_Lite.user.js
          grep -q "MEASUREMENT_RENEW_BEFORE_MS = 10 \* 60 \* 1000" FCR_Data_Core.user.js
          grep -q "madcatSource: 'raw'" FCR_Data_Core.user.js
          grep -q "madcatSource: 'history'" FCR_Data_Core.user.js
          grep -q "measurementSource) !== 'MADCAT'" FCR_Data_Core.user.js
          ! grep -q "measurement-request-failed" FCR_Data_Core.user.js
          grep -q "history-no' ? 'Madcat: NO?'" FCResearch_Master.user.js
          grep -q "history-no' ? 'NO?'" FC_Lite.user.js
          grep -q "background:#2563eb" FCResearch_Master.user.js
          grep -q "background:#16a34a" FC_Lite.user.js
          git diff --check

          git add FCR_Data_Core.user.js FCResearch_Master.user.js FC_Lite.user.js README.md
          git rm .github/workflows/apply-madcat-auto-auth-once.yml
          git diff --cached --check
          git commit -m "feat: auto-renew MADCAT auth from user gestures"
          git push origin HEAD:main

          main_short="$(git rev-parse --short HEAD)"
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b madcat-auto-auth-pack-sync "$worktree" origin/work-laptop-pack
          cp FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          cp FCResearch_Master.user.js "$worktree/04_FCResearch_Master.txt"
          cp FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          sed -i -E 's/^03 FCR Data Core v.*/03 FCR Data Core v0.2.17/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E 's/^04 FCResearch Master v.*/04 FCResearch Master v0.1.25/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E 's/^05 FC-Lite v.*/05 FC-Lite v0.1.64/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E "s/^Updater-enabled sources: main [0-9a-f]+\.$/Updater-enabled sources: main ${main_short}./" "$worktree/WORK_LAPTOP_INSTALL.txt"

          cmp -s FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          cmp -s FCResearch_Master.user.js "$worktree/04_FCResearch_Master.txt"
          cmp -s FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          node --check "$worktree/03_FCR_Data_Core.txt"
          node --check "$worktree/04_FCResearch_Master.txt"
          node --check "$worktree/05_FC-Lite.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 03_FCR_Data_Core.txt 04_FCResearch_Master.txt 05_FC-Lite.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" diff --cached --check
          git -C "$worktree" commit -m "sync: MADCAT auto auth"
          git -C "$worktree" push origin HEAD:work-laptop-pack
