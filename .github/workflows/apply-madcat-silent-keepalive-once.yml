name: Apply MADCAT silent keepalive once

on:
  push:
    paths:
      - '.github/workflows/apply-madcat-silent-keepalive-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch validate publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('FCR_Data_Core.user.js')
          text = path.read_text(encoding='utf-8')

          text = replace_once(text, '// @version      0.2.22', '// @version      0.2.23', 'core metadata version')
          text = replace_once(text, "const VERSION = '0.2.22';", "const VERSION = '0.2.23';", 'core runtime version')
          text = replace_once(
              text,
              '// @description  Strict binDescription plus shift-cached global 30-day raw MADCAT with on-demand measurement auth.',
              '// @description  Strict binDescription plus shift-cached global 30-day raw MADCAT with silent measurement-auth keepalive and on-demand fallback.',
              'core description'
          )
          text = replace_once(
              text,
              "  const MEASUREMENT_BRIDGE_ATTEMPT_KEY = 'fcr-data-core:measurement-bridge-at-v1';",
              "  const MEASUREMENT_BRIDGE_ATTEMPT_KEY = 'fcr-data-core:measurement-bridge-at-v1';\n  const MEASUREMENT_KEEPALIVE_OWNER_KEY = 'fcr-data-core:measurement-keepalive-owner-v1';",
              'keepalive owner key'
          )
          text = replace_once(
              text,
              "  const MEASUREMENT_BRIDGE_WAIT_MS = 6500;\n  const MEASUREMENT_LOOKBACK_MS = 30 * 24 * 60 * 60 * 1000;",
              "  const MEASUREMENT_BRIDGE_WAIT_MS = 6500;\n  const MEASUREMENT_KEEPALIVE_TTL_MS = 5 * 60 * 1000;\n  const MEASUREMENT_KEEPALIVE_HEARTBEAT_MS = 60 * 1000;\n  const MEASUREMENT_LOOKBACK_MS = 30 * 24 * 60 * 60 * 1000;",
              'keepalive timing'
          )
          text = replace_once(
              text,
              "  const clean = value => String(value ?? '').replace(/\\u00a0/g, ' ').replace(/\\s+/g, ' ').trim();\n  const upper = value => clean(value).toUpperCase();",
              "  const measurementKeepaliveOwner = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;\n  let measurementKeepaliveHeartbeat = 0;\n\n  const clean = value => String(value ?? '').replace(/\\u00a0/g, ' ').replace(/\\s+/g, ' ').trim();\n  const upper = value => clean(value).toUpperCase();",
              'keepalive owner state'
          )

          old = """  function measurementBridgeUrl(identifier) {
            const url = new URL(`https://${MEASUREMENT_SITE_HOST}/item/${encodeURIComponent(identifier)}`);
            url.searchParams.set('fcrMadcatBridge', '1');
            url.searchParams.set('fcrMadcatAuto', '1');
            return url.href;
          }

          function gestureMeasurementIdentifier(target) {
          """
          new = """  function measurementBridgeUrl(identifier) {
            const url = new URL(`https://${MEASUREMENT_SITE_HOST}/item/${encodeURIComponent(identifier)}`);
            url.searchParams.set('fcrMadcatBridge', '1');
            url.searchParams.set('fcrMadcatAuto', '1');
            return url.href;
          }

          function measurementKeepaliveUrl(identifier) {
            const url = new URL(measurementBridgeUrl(identifier));
            url.searchParams.set('fcrMadcatKeepalive', '1');
            return url.href;
          }

          function readMeasurementKeepaliveOwner() {
            try {
              const raw = GM_getValue(MEASUREMENT_KEEPALIVE_OWNER_KEY, '');
              const value = typeof raw === 'string' ? JSON.parse(raw || '{}') : raw;
              return {
                owner: String(value?.owner || ''),
                at: Number(value?.at) || 0
              };
            } catch {
              return { owner: '', at: 0 };
            }
          }

          function writeMeasurementKeepaliveOwner() {
            const record = { owner: measurementKeepaliveOwner, at: Date.now() };
            try { GM_setValue(MEASUREMENT_KEEPALIVE_OWNER_KEY, JSON.stringify(record)); } catch { return false; }
            return readMeasurementKeepaliveOwner().owner === measurementKeepaliveOwner;
          }

          function releaseMeasurementKeepaliveOwner() {
            const current = readMeasurementKeepaliveOwner();
            if (current.owner !== measurementKeepaliveOwner) return;
            try { GM_deleteValue(MEASUREMENT_KEEPALIVE_OWNER_KEY); } catch {}
          }

          function ensureMeasurementKeepalive(identifier) {
            const wanted = measurementIdentifierCandidate(identifier || readMeasurementIdentifier());
            if (!wanted) return false;

            const existing = document.getElementById('fcr-madcat-keepalive-frame');
            if (existing?.isConnected) {
              writeMeasurementKeepaliveOwner();
              return true;
            }

            const current = readMeasurementKeepaliveOwner();
            if (current.owner && current.owner !== measurementKeepaliveOwner && Date.now() - current.at < MEASUREMENT_KEEPALIVE_TTL_MS) return false;
            if (!writeMeasurementKeepaliveOwner()) return false;

            const mount = () => {
              const root = document.body || document.documentElement;
              if (!root) return false;
              const already = document.getElementById('fcr-madcat-keepalive-frame');
              if (already?.isConnected) return true;

              const owner = readMeasurementKeepaliveOwner();
              if (owner.owner && owner.owner !== measurementKeepaliveOwner && Date.now() - owner.at < MEASUREMENT_KEEPALIVE_TTL_MS) return false;
              if (!writeMeasurementKeepaliveOwner()) return false;

              const frame = document.createElement('iframe');
              frame.id = 'fcr-madcat-keepalive-frame';
              frame.src = measurementKeepaliveUrl(wanted);
              frame.tabIndex = -1;
              frame.setAttribute('aria-hidden', 'true');
              frame.style.cssText = 'position:fixed!important;left:-10000px!important;top:-10000px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;border:0!important;';
              root.appendChild(frame);
              recordUsage('madcat.auth.keepalive-start');

              if (!measurementKeepaliveHeartbeat) {
                measurementKeepaliveHeartbeat = setInterval(() => {
                  const node = document.getElementById('fcr-madcat-keepalive-frame');
                  if (!node?.isConnected) return;
                  const active = readMeasurementKeepaliveOwner();
                  if (active.owner && active.owner !== measurementKeepaliveOwner && Date.now() - active.at < MEASUREMENT_KEEPALIVE_TTL_MS) {
                    node.remove();
                    clearInterval(measurementKeepaliveHeartbeat);
                    measurementKeepaliveHeartbeat = 0;
                    return;
                  }
                  writeMeasurementKeepaliveOwner();
                }, MEASUREMENT_KEEPALIVE_HEARTBEAT_MS);
              }

              if (!window.__fcrMeasurementKeepaliveCleanup_v1) {
                window.__fcrMeasurementKeepaliveCleanup_v1 = true;
                window.addEventListener('pagehide', () => {
                  if (measurementKeepaliveHeartbeat) clearInterval(measurementKeepaliveHeartbeat);
                  measurementKeepaliveHeartbeat = 0;
                  releaseMeasurementKeepaliveOwner();
                }, { once: true });
              }
              return true;
            };

            if (mount()) return true;
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, { once: true });
            return false;
          }

          function gestureMeasurementIdentifier(target) {
          """
          text = replace_once(text, old, new, 'silent keepalive helpers')

          text = replace_once(
              text,
              "    rememberMeasurementIdentifier(identifier);\n\n    if (!force) {",
              "    rememberMeasurementIdentifier(identifier);\n    if (readMeasurementAuth()) ensureMeasurementKeepalive(identifier);\n\n    if (!force) {",
              'keepalive before MADCAT cache'
          )
          text = replace_once(
              text,
              "    if (!auth) {\n      stats.madcatAuthRequired++;\n      return fallbackMadcatToInventoryHistory(identifier, force, 'measurement-login-required');\n    }\n\n    const key = `madcat30:${identifierType}:${identifier}:${force ? 'force' : 'normal'}`;",
              "    if (!auth) {\n      stats.madcatAuthRequired++;\n      return fallbackMadcatToInventoryHistory(identifier, force, 'measurement-login-required');\n    }\n    ensureMeasurementKeepalive(identifier);\n\n    const key = `madcat30:${identifierType}:${identifier}:${force ? 'force' : 'normal'}`;",
              'keepalive after auth acquisition'
          )

          path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          rtext = readme.read_text(encoding='utf-8')
          rtext = replace_once(rtext, '| FCR Data Core | 0.2.22 |', '| FCR Data Core | 0.2.23 |', 'README core version')
          readme.write_text(rtext, encoding='utf-8')
          PY

          node --check FCR_Data_Core.user.js
          grep -q '@version      0.2.23' FCR_Data_Core.user.js
          grep -q "const VERSION = '0.2.23';" FCR_Data_Core.user.js
          grep -q 'fcr-madcat-keepalive-frame' FCR_Data_Core.user.js
          grep -q "fcrMadcatKeepalive', '1'" FCR_Data_Core.user.js
          grep -q 'MEASUREMENT_KEEPALIVE_HEARTBEAT_MS = 60 \* 1000' FCR_Data_Core.user.js
          ! grep -q '^  installMeasurementAutoRenewal();$' FCR_Data_Core.user.js
          grep -q '| FCR Data Core | 0.2.23 |' README.md
          git diff --check

          git add FCR_Data_Core.user.js README.md
          git rm .github/workflows/apply-madcat-silent-keepalive-once.yml
          git diff --cached --check
          git commit -m "fix(core): keep MADCAT auth warm silently"
          git push origin HEAD:main
