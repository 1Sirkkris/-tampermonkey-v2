          +            ` → ${esc(item.destination || live.dest)}</div>`;
          +        }).join('');
          +      }
               }
           
               const liveWorking = !!(
          @@ -1641,7 +1677,7 @@
               clearTimeout(live.oneErrorTimer);
               live.oneErrorTimer = 0;
               live.oneErrorToken++;
          -    live.oneTransientError = '';
          +    live.oneResult = null;
               live.oneInFlight.clear();
           
               live.running = false;
          @@ -1689,7 +1725,7 @@
               clearTimeout(live.oneErrorTimer);
               live.oneErrorTimer = 0;
               live.oneErrorToken++;
          -    live.oneTransientError = '';
          +    live.oneResult = null;
               live.oneInFlight.clear();
           
               live.running = false;
          @@ -1928,13 +1964,32 @@
               renderLive();
             }
           
          +  function setOneByOneResult(item, ok, reason='') {
          +    const meta = liveItemMeta(item);
          +    const token = ++live.oneErrorToken;
          +    clearTimeout(live.oneErrorTimer);
          +    live.oneResult = {
          +      ok:!!ok,
          +      scan:meta.scan,
          +      asin:meta.asin,
          +      fnsku:meta.fnsku,
          +      reason:clean(reason)
