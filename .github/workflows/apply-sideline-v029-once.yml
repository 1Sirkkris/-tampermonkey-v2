          +    setOneByOneResult(item, false, reason);
               renderLive();
               finishMoveCorner('live', false);
          -
          -    live.oneErrorTimer = setTimeout(() => {
          -      if (live.oneErrorToken !== token) return;
          -      live.oneErrorTimer = 0;
          -      live.oneTransientError = '';
          -      renderLive();
          -    }, 5000);
             }
           
             function blockOneByOneDestination(item, title, reason, ctx, expirationMs) {
          @@ -2037,7 +2082,7 @@
               }
           
               if (reason === 'HAZMAT' || /destination incompatible/i.test(reason)) {
          -      blockOneByOneDestination(item, 'HAZMAT / DESTINATION ISSUE', reason || 'HAZMAT', ctx, expirationMs);
          +      showOneByOneError(item, reason || 'HAZMAT');
                 return;
               }
           
          PATCH

          sed 's/^          //' /tmp/sideline-v029.patch > /tmp/sideline-v029.clean.patch
          git apply --check /tmp/sideline-v029.clean.patch
          git apply /tmp/sideline-v029.clean.patch

          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          old = '| Sideline API Move | 0.2.8 |'
          new = '| Sideline API Move | 0.2.9 |'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one README Sideline 0.2.8 row, found {text.count(old)}')
          readme.write_text(text.replace(old, new, 1))
          PY

          node --check Sideline_API_Move.user.js
          grep -Fq '// @version      0.2.9' Sideline_API_Move.user.js
          grep -Fq "const VERSION = '0.2.9';" Sideline_API_Move.user.js
          grep -Fq 'data-live-one-result' Sideline_API_Move.user.js
          grep -Fq 'AUTO-SKIPPED' Sideline_API_Move.user.js
          ! grep -Fq 'oneTransientError' Sideline_API_Move.user.js
          test "$(grep -Fc 'live.history.unshift(item);' Sideline_API_Move.user.js)" -eq 1

          git add Sideline_API_Move.user.js README.md
          git diff --cached --check
          git commit -m "fix(sideline): make 1x1 results transient and nonblocking"
          git push origin HEAD:main

          cp Sideline_API_Move.user.js /tmp/01_Sideline.txt
          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          cp /tmp/01_Sideline.txt 01_Sideline.txt
          cp 01_Sideline.txt /tmp/01_Sideline.js
          node --check /tmp/01_Sideline.js
          cmp -s /tmp/01_Sideline.txt 01_Sideline.txt
          git add 01_Sideline.txt
          git diff --cached --check
          git commit -m "sync(sideline): deploy v0.2.9 to laptop pack"
          git push origin HEAD:work-laptop-pack
