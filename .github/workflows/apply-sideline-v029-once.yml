name: Apply Sideline v0.2.9 once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v029-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate v0.2.9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git branch --show-current)" = "main"
          grep -Fq '// @version      0.2.8' Sideline_API_Move.user.js
          grep -Fq "const VERSION = '0.2.8';" Sideline_API_Move.user.js

          cat > /tmp/sideline-v029.patch <<'PATCH'
          --- a/Sideline_API_Move.user.js
          +++ b/Sideline_API_Move.user.js
