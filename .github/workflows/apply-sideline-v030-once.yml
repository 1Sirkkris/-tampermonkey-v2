name: Apply Sideline v0.3.0 mode isolation once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v030-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated mode policies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "8b833492ee80aad7a77aaaf7b279174e239e01ea"

