          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          raw = base64.b64decode(Path('/tmp/sideline-v030.patch.z64').read_text().replace('\n',''))
          Path('/tmp/sideline-v030.patch').write_bytes(zlib.decompress(raw))
          PY
          git apply --check /tmp/sideline-v030.patch
          git apply /tmp/sideline-v030.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = '| Sideline API Move | 0.2.9 |'
          new = '| Sideline API Move | 0.3.0 |'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one README Sideline 0.2.9 row, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

          node --check Sideline_API_Move.user.js
          test "$(git hash-object Sideline_API_Move.user.js)" = "fefa34f9f594d215e4bd30465df9283f6641e649"

          python - <<'PY'
          from pathlib import Path
          s = Path('Sideline_API_Move.user.js').read_text()
          checks = {
              'version': s.count('0.3.0') >= 3,
              'old barcode blocker absent': 'function blockLiveBarcode' not in s,
              'old generic blocker absent': 'function blockLiveGeneric' not in s,
              '1x1 off immediate': 'WAIT — ${live.oneInFlight.size || 1} item still sending.' not in s,
              'no reset demand': 'RESET LIVE before changing 1×1 mode.' not in s,
              'Live auto-skip': 'function failLiveItem' in s,
              'failure image': 'sh-live-failure-img' in s and 'productImageUrl(ctx)' in s,
              '1x1 qty one': 'buildMovePayload(live.src, item.destination, live.sourceMeta, ctx, 1, expirationMs)' in s,
              'Live paced': 'if (!await waitForLiveMovePace(item, run)) return false;' in s,
              'Live expiry deferred': "if (!live.oneByOne && (live.processing || live.current || live.queue.length)) return;" in s,
              '1x1 expiry blocks next': 'EXPIRY REQUIRED — finish the current 1×1 item before scanning another.' in s,
              'Live invalid auto-skip': "failLiveItem(item, 'INVALID BARCODE — ITEM NOT MOVED', 'INVALID BARCODE');" in s,
              'Hazmat 1x1 fails': "showOneByOneError(item, reason || 'HAZMAT'" in s,
              'Lazy preserved on mode switch': 'function stopLazyForModeSwitch' in s,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('Policy checks failed: ' + ', '.join(bad))
          helper = s[s.index('function stopLazyForModeSwitch'):s.index('function resetLazy')]
          if 'lazy.items = []' in helper or "lItems.value = ''" in helper:
