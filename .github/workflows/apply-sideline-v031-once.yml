name: Apply Sideline v0.3.9 direct close once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v031-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          test "$(git hash-object Sideline_API_Move.user.js)" = "8a4b9dbe80dc351fee34904f38c7f930e587e3d2"
          python - <<'PY'
          from pathlib import Path

          path = Path('Sideline_API_Move.user.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def replace_between(start_marker, end_marker, new_block, label):
              global text
              if text.count(start_marker) != 1:
                  raise SystemExit(f'{label}: start marker count {text.count(start_marker)}')
              start = text.index(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              text = text[:start] + new_block.rstrip() + '\n\n' + text[end:]

          def js(*lines):
              return '\n'.join(lines)

          replace_once('// @name         MAIN v0.3.8 Sideline API Move TEST', '// @name         MAIN v0.3.9 Sideline API Move TEST', 'name version')
          replace_once('// @version      0.3.8', '// @version      0.3.9', 'metadata version')
          replace_once("  const VERSION = '0.3.8';", "  const VERSION = '0.3.9';", 'runtime version')
          replace_once(
              "  const API_SCAN_SOURCE = '/api/scan-source-container';",
              "  const API_SCAN_SOURCE = '/api/scan-source-container';\n  const API_CLOSE_CONTAINER = '/api/close-container';",
              'close endpoint constant'
          )

          predicant_recovery = js(
              "  async function runExactPredicantRecovery(sourceCode, destinationCode, status, run) {",
              "    status(`Predicant recovery 1/4 — validating source ${sourceCode} by API...`);",
              "    const sourceResponse = await api(API_SCAN_SOURCE, scanSourcePayload(sourceCode), run);",
              "    if (!currentLazyRun(run) || !sourceResponse || sourceResponse.success !== true) {",
              "      throw new Error('Original source API validation failed during Predicant recovery.');",
              "    }",
              "",
              "    status('Predicant recovery 2/4 — closing original source with NO by API...');",
              "    await closeContainerDirect(sourceCode, false);",
              "    if (!currentLazyRun(run)) throw makeAbortError('Predicant recovery cancelled after source close.');",
              "",
              "    status(`Predicant recovery 3/4 — validating destination ${destinationCode} by API...`);",
              "    const destinationResponse = await api(API_SCAN_SOURCE, scanSourcePayload(destinationCode), run);",
              "    if (!currentLazyRun(run) || !destinationResponse || destinationResponse.success !== true) {",
              "      throw new Error('Destination API validation failed during Predicant recovery.');",
              "    }",
              "",
              "    status(`Predicant recovery 4/4 — emptying destination ${destinationCode} with YES by API...`);",
              "    await closeContainerDirect(destinationCode, true);",
              "    if (!currentLazyRun(run)) throw makeAbortError('Predicant recovery cancelled after destination close.');",
              "",
              "    return true;",
              "  }"
          )
          replace_between(
              "  async function runExactPredicantRecovery(",
              "  // UI",
              predicant_recovery,
              'predicant recovery'
          )

          close_helper = js(
              "  function closeContainerPayload(container, containerEmpty) {",
              "    return {",
              "      containerScannableId:container,",
              "      containerEmpty:containerEmpty === true,",
              "      directedLabel:false,",
              "      processPath:'UNDETERMINED',",
              "      requestId:requestId(),",
              "      tool:TOOL",
              "    };",
              "  }",
              "",
              "  async function closeContainerDirect(container, containerEmpty) {",
              "    const code = clean(container);",
              "    if (!validContainer(code)) throw new Error('Direct close requires a valid csX/tsX container.');",
              "",
              "    let response;",
              "    try {",
              "      response = await fetch(API_CLOSE_CONTAINER, {",
              "        method:'POST',",
              "        credentials:'same-origin',",
              "        headers:{'content-type':'application/json'},",
              "        body:JSON.stringify(closeContainerPayload(code, containerEmpty))",
              "      });",
              "    } catch (cause) {",
              "      const error = new Error(`Close outcome UNKNOWN for ${code} — verify container state manually before retrying.`);",
              "      error.name = 'CloseOutcomeUnknownError';",
              "      error.outcomeUnknown = true;",
              "      error.cause = cause;",
              "      throw error;",
              "    }",
              "",
              "    let raw = '';",
              "    try {",
              "      raw = await response.text();",
              "    } catch (cause) {",
              "      const error = new Error(`Close outcome UNKNOWN for ${code} — response could not be read. Verify container state manually before retrying.`);",
              "      error.name = 'CloseOutcomeUnknownError';",
              "      error.outcomeUnknown = true;",
              "      error.cause = cause;",
              "      throw error;",
              "    }",
              "",
              "    let payload = raw;",
              "    try { payload = raw ? JSON.parse(raw) : null; } catch {}",
              "",
              "    if (",
              "      !response.ok ||",
              "      clean(payload?.['@type']) !== 'CloseContainerResponse' ||",
              "      payload?.success !== true",
              "    ) {",
              "      const error = new Error(`Close NOT CONFIRMED for ${code}${response.ok ? '' : ` — HTTP ${response.status}`} — verify state before retrying.`);",
              "      error.name = 'CloseNotConfirmedError';",
              "      error.outcomeUnknown = true;",
              "      error.payload = payload;",
              "      throw error;",
              "    }",
              "",
              "    return payload;",
              "  }"
          )
          replace_once(
              "  function beginLazyRun() {",
              close_helper + "\n\n  function beginLazyRun() {",
              'direct close helper insertion'
          )

          clear_live = js(
              "  async function clearLiveSource() {",
              "    if (!live.sourceReady || !live.src) {",
              "      live.error = 'No Live source container to clear.';",
              "      live.note = '';",
              "      renderLive();",
              "      setTimeout(() => liveSrc.focus(), 0);",
              "      return;",
              "    }",
              "",
              "    const pending =",
              "      sumQty(live.queue) +",
              "      live.oneInFlight.size +",
              "      (live.current ? itemQty(live.current) : 0) +",
              "      sumQty(live.datePending);",
              "    if (live.processing || live.issue || pending) {",
              "      live.error = `CANNOT CLEAR SOURCE — ${pending || 1} item${(pending || 1) === 1 ? '' : 's'} still processing/blocked/queued.`;",
              "      live.note = live.datePending.length",
              "        ? `finish ${live.datePending.length} pending expiry/production item${live.datePending.length === 1 ? '' : 's'} first`",
              "        : 'finish or skip current work first';",
              "      renderLive();",
              "      return;",
              "    }",
              "",
              "    const sourceCode = live.src;",
              "",
              "    live.running = false;",
              "    liveScan.disabled = true;",
              "    live.error = '';",
              "    live.note = `clearing source ${sourceCode} by API`;",
              "    renderLive();",
              "",
              "    shared.owner = 'live';",
              "",
              "    try {",
              "      await closeContainerDirect(sourceCode, true);",
              "      resetLive(`SOURCE CLEARED — ${sourceCode} — scan next source`);",
              "    } catch (error) {",
              "      live.running = false;",
              "      live.error = error?.outcomeUnknown",
              "        ? `SOURCE CLEAR UNKNOWN — ${error?.message || error}`",
              "        : `SOURCE CLEAR FAILED — ${error?.message || error}`;",
              "      live.note = error?.outcomeUnknown",
              "        ? 'VERIFY SOURCE STATE MANUALLY — no automatic close retry was sent'",
              "        : 'handle source manually';",
              "      liveScan.disabled = true;",
              "      liveDest.disabled = true;",
              "      shared.owner = 'live';",
              "      renderLive();",
              "    }",
              "  }"
          )
          replace_between(
              "  async function clearLiveSource() {",
              "  async function acceptLiveSource() {",
              clear_live,
              'live direct source clear'
          )

          wait_predicant = js(
              "  async function waitPredicant(item, run) {",
              "    lazy.predicant = true;",
              "    lazy.paused = true;",
              "    lazy.error = `WAITING FOR YOU — RESCAN DESTINATION ${lazy.dest} TO CONTINUE`;",
              "    lazy.note = `${item.code} paused — no more moves will run until destination is rescanned`;",
              "    renderLazy();",
              "",
              "    if (!lazy.inputCollapsed) lItems.focus();",
              "    lPredicantCard?.scrollIntoView?.({block:'nearest', inline:'nearest'});",
              "",
              "    await new Promise(resolve => { lazy.predicantResolve = resolve; });",
              "    if (!currentLazyRun(run) || !lazy.running) return false;",
              "",
              "    lazy.predicant = true;",
              "    lazy.paused = true;",
              "    shared.owner = 'lazy-recovery';",
              "",
              "    const setRecovery = message => {",
              "      lazy.error = '';",
              "      lazy.note = message;",
              "      renderLazy();",
              "    };",
              "",
              "    try {",
              "      await runExactPredicantRecovery(lazy.src, lazy.dest, setRecovery, run);",
              "",
              "      setRecovery(`Destination reset — revalidating ${lazy.src}...`);",
              "",
              "      const sourceResponse = await api(API_SCAN_SOURCE, scanSourcePayload(lazy.src), run);",
              "",
              "      if (!currentLazyRun(run) || !sourceResponse || sourceResponse.success !== true) {",
              "        throw new Error('Source revalidation failed after Predicant recovery.');",
              "      }",
              "",
              "      lazy.sourceMeta = sourceResponse;",
              "      lazy.predicant = false;",
              "      lazy.paused = false;",
              "      lazy.error = '';",
              "      lazy.note = `Destination reset — retrying ${item.code} ×${item.qty}`;",
              "      shared.owner = 'lazy';",
              "      renderLazy();",
              "      await sleep(180);",
              "      return true;",
              "    } catch (error) {",
              "      if (runWasCancelled(error, run)) return false;",
              "",
              "      if (error?.outcomeUnknown) {",
              "        cancelLazyRun();",
              "        lazy.running = false;",
              "        lazy.predicant = false;",
              "        lazy.paused = false;",
              "        lazy.error = `Predicant recovery stopped — ${error?.message || error}`;",
              "        lazy.note = 'VERIFY CONTAINER STATE MANUALLY — no automatic close retry was sent';",
              "        shared.owner = '';",
              "        setLazyRunningIndicator(false);",
              "        renderLazy();",
              "        return false;",
              "      }",
              "",
              "      lazy.predicant = true;",
              "      lazy.paused = true;",
              "      lazy.error = `Predicant recovery stopped: ${error?.message || error}`;",
              "      lazy.note = 'scan destination again to retry recovery';",
              "      shared.owner = 'lazy';",
              "      renderLazy();",
              "      return false;",
              "    }",
              "  }"
          )
          replace_between(
              "  async function waitPredicant(item, run) {",
              "  async function moveResolved(",
              wait_predicant,
              'predicant wait safety'
          )

          safe_clear = js(
              "  async function safeClearSourceWhenDone() {",
              "    if (!lClear.checked) return true;",
              "",
              "    const previousOwner = shared.owner;",
              "    shared.owner = 'lazy-clear';",
              "    lazy.note = `clearing source ${lazy.src} by API`;",
              "    lazy.error = '';",
              "    renderLazy();",
              "",
              "    try {",
              "      await closeContainerDirect(lazy.src, true);",
              "      return true;",
              "    } catch (error) {",
              "      lazy.error = error?.outcomeUnknown",
              "        ? `Moves complete — source clear UNKNOWN: ${error?.message || error}`",
              "        : `Moves complete — source clear failed: ${error?.message || error}`;",
              "      return false;",
              "    } finally {",
              "      shared.owner = previousOwner;",
              "    }",
              "  }"
          )
          replace_between(
              "  async function safeClearSourceWhenDone() {",
              "  async function startLazy() {",
              safe_clear,
              'lazy direct source clear'
          )

          path.write_text(text)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old_row = '| Sideline API Move | 0.3.8 |'
          new_row = '| Sideline API Move | 0.3.9 |'
          if readme.count(old_row) != 1:
              raise SystemExit(f'README Sideline row: expected 1 match, found {readme.count(old_row)}')
          readme_path.write_text(readme.replace(old_row, new_row, 1))
          PY
          node --check Sideline_API_Move.user.js
          git diff --check
          grep -q "@version      0.3.9" Sideline_API_Move.user.js
          grep -q "API_CLOSE_CONTAINER = '/api/close-container'" Sideline_API_Move.user.js
          grep -q "containerEmpty:containerEmpty === true" Sideline_API_Move.user.js
          grep -q "closeContainerDirect(sourceCode, false)" Sideline_API_Move.user.js
          grep -q "closeContainerDirect(destinationCode, true)" Sideline_API_Move.user.js
          grep -q "closeContainerDirect(sourceCode, true)" Sideline_API_Move.user.js
          grep -q "closeContainerDirect(lazy.src, true)" Sideline_API_Move.user.js
          grep -q "no automatic close retry was sent" Sideline_API_Move.user.js
          git add Sideline_API_Move.user.js README.md
          git diff --cached --check
          git commit -m "perf(sideline): use proven close-container API paths"
          git push origin HEAD:main
