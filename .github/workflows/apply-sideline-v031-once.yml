name: Apply Sideline v0.3.11 Live delay toggle once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v031-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          # Exact v0.3.10 canonical baseline. Refuse to touch an unexpected/newer file.
          test "$(git hash-object Sideline_API_Move.user.js)" = "a232873315554cce5676ec81b1c81faf0d4302ed"

          python - <<'PY'
          from pathlib import Path

          path = Path('Sideline_API_Move.user.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def block(*lines):
              return '\n'.join(lines) + '\n'

          replace_once('// @name         MAIN v0.3.10 Sideline API Move TEST', '// @name         MAIN v0.3.11 Sideline API Move TEST', 'name version')
          replace_once('// @version      0.3.10', '// @version      0.3.11', 'metadata version')
          replace_once("  const VERSION = '0.3.10';", "  const VERSION = '0.3.11';", 'runtime version')

          replace_once(
              "    nextMoveAt:0,\n    datePending:[],",
              "    nextMoveAt:0,\n    delayEnabled:true,\n    datePending:[],",
              'Live delay state'
          )

          replace_once(
              "#sh-live .sh-live-ready{margin:7px 0;padding:7px 9px;border:1px solid #bfdbfe;border-left:5px solid #146eb4;background:#eff6ff;color:#0f3d73;font-weight:900}\n",
              "#sh-live .sh-live-ready{margin:7px 0;padding:7px 9px;border:1px solid #bfdbfe;border-left:5px solid #146eb4;background:#eff6ff;color:#0f3d73;font-weight:900}\n#sh-live .sh-live-delay{padding:5px 9px;min-width:90px;font-size:11px}\n",
              'Live delay CSS'
          )

          replace_once(
              "    '<div class=\"sh-live-ready\">QTY = 1 PER SCAN — PRECHECK snoops queued items immediately; duplicates merge; moves pace 5–11s apart.</div>' +\n    '<div class=\"sh-grid4\">' +",
              "    '<div class=\"sh-live-ready\">QTY = 1 PER SCAN — PRECHECK snoops queued items immediately; duplicates merge; moves pace 5–11s apart.</div>' +\n    '<div style=\"display:flex;justify-content:flex-end;margin:-2px 0 7px\"><button class=\"sh-btn sh-live-delay\" data-live-a=\"delay\" data-live-delay>Delay: YES</button></div>' +\n    '<div class=\"sh-grid4\">' +",
              'Live delay button'
          )

          replace_once(
              "  const liveReady = $('.sh-live-ready', livePanel);\n  const liveQueueLabel = $('[data-live-queue-label]', livePanel);",
              "  const liveReady = $('.sh-live-ready', livePanel);\n  const liveDelay = $('[data-live-delay]', livePanel);\n  const liveQueueLabel = $('[data-live-queue-label]', livePanel);",
              'Live delay element'
          )

          replace_once(
              block(
                  "    setTextIfChanged(liveQueueLabel, live.oneByOne ? 'Active' : 'Queued');",
                  "    setTextIfChanged(",
                  "      liveReady,",
                  "      live.oneByOne",
                  "        ? 'NO QUEUE — EVERY SCAN SENDS ITS OWN QTY 1 MOVE IMMEDIATELY. Item errors clear after 5 seconds; expiry uses the date panel.'",
                  "        : 'QTY = 1 PER SCAN — PRECHECK snoops queued items immediately; duplicates merge; moves pace 5–11s apart.'",
                  "    );"
              ),
              block(
                  "    setTextIfChanged(liveQueueLabel, live.oneByOne ? 'Active' : 'Queued');",
                  "    if (liveDelay) {",
                  "      liveDelay.style.display = live.oneByOne ? 'none' : '';",
                  "      liveDelay.textContent = `Delay: ${live.delayEnabled ? 'YES' : 'NO'}`;",
                  "      liveDelay.classList.toggle('sh-on', live.delayEnabled);",
                  "      liveDelay.title = live.delayEnabled",
                  "        ? 'Artificial Live move pacing is ON (5–11 seconds).'",
                  "        : 'Artificial Live move pacing is OFF.';",
                  "    }",
                  "    setTextIfChanged(",
                  "      liveReady,",
                  "      live.oneByOne",
                  "        ? 'NO QUEUE — EVERY SCAN SENDS ITS OWN QTY 1 MOVE IMMEDIATELY. Item errors clear after 5 seconds; expiry uses the date panel.'",
                  "        : live.delayEnabled",
                  "          ? 'QTY = 1 PER SCAN — PRECHECK snoops queued items immediately; duplicates merge; moves pace 5–11s apart.'",
                  "          : 'QTY = 1 PER SCAN — PRECHECK snoops queued items immediately; duplicates merge; NO ARTIFICIAL MOVE DELAY.'",
                  "    );"
              ),
              'Live delay render'
          )

          replace_once(
              block(
                  "  async function waitForLiveMovePace(item, run=live.activeRun) {",
                  "    if (!currentLiveRun(run) || !live.running) return false;",
                  "",
                  "    const waitMs = Math.max(0, live.nextMoveAt - Date.now());",
                  "    if (!waitMs) return true;",
                  "",
                  "    live.note = `paced wait ${(waitMs / 1000).toFixed(1)}s | ${item.code} ready`;",
                  "    renderLive();",
                  "",
                  "    return await waitLiveMs(waitMs, run);",
                  "  }"
              ),
              block(
                  "  async function waitForLiveMovePace(item, run=live.activeRun) {",
                  "    if (!currentLiveRun(run) || !live.running) return false;",
                  "    if (!live.delayEnabled) return true;",
                  "",
                  "    let waitMs = Math.max(0, live.nextMoveAt - Date.now());",
                  "    if (!waitMs) return true;",
                  "",
                  "    live.note = `paced wait ${(waitMs / 1000).toFixed(1)}s | ${item.code} ready`;",
                  "    renderLive();",
                  "",
                  "    while (live.delayEnabled) {",
                  "      waitMs = Math.max(0, live.nextMoveAt - Date.now());",
                  "      if (!waitMs) return true;",
                  "      if (!await waitLiveMs(Math.min(waitMs, 200), run)) return false;",
                  "    }",
                  "",
                  "    return currentLiveRun(run) && live.running;",
                  "  }"
              ),
              'Live pacing gate'
          )

          old_pace = "live.nextMoveAt = Date.now() + randomLiveMoveDelayMs();"
          if text.count(old_pace) != 2:
              raise SystemExit(f'Live pacing assignments: expected 2 matches, found {text.count(old_pace)}')
          text = text.replace(old_pace, "live.nextMoveAt = live.delayEnabled ? Date.now() + randomLiveMoveDelayMs() : 0;")

          replace_once(
              block(
                  "    if (action === 'clear-source') {",
                  "      clearLiveSource();",
                  "      return;",
                  "    }",
                  "",
                  "    if (action === 'skip') {"
              ),
              block(
                  "    if (action === 'clear-source') {",
                  "      clearLiveSource();",
                  "      return;",
                  "    }",
                  "",
                  "    if (action === 'delay') {",
                  "      if (live.oneByOne) return;",
                  "      live.delayEnabled = !live.delayEnabled;",
                  "      if (!live.delayEnabled) live.nextMoveAt = 0;",
                  "      live.note = live.delayEnabled",
                  "        ? 'move delay ON — 5–11s pacing'",
                  "        : 'move delay OFF — no artificial pacing';",
                  "      renderLive();",
                  "      return;",
                  "    }",
                  "",
                  "    if (action === 'skip') {"
              ),
              'Live delay action'
          )

          path.write_text(text)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old_row = '| Sideline API Move | 0.3.10 |'
          new_row = '| Sideline API Move | 0.3.11 |'
          if readme.count(old_row) != 1:
              raise SystemExit(f'README Sideline row: expected 1 match, found {readme.count(old_row)}')
          readme_path.write_text(readme.replace(old_row, new_row, 1))
          PY

          node --check Sideline_API_Move.user.js
          git diff --check
          grep -q "@version      0.3.11" Sideline_API_Move.user.js
          grep -q "const API_CLOSE_CONTAINER = '/api/close-container';" Sideline_API_Move.user.js
          grep -q "delayEnabled:true" Sideline_API_Move.user.js
          grep -q 'data-live-delay>Delay: YES' Sideline_API_Move.user.js
          grep -q "if (!live.delayEnabled) return true;" Sideline_API_Move.user.js
          test "$(grep -c 'live.nextMoveAt = live.delayEnabled ?' Sideline_API_Move.user.js)" = "2"
          grep -q "if (live.oneByOne) return;" Sideline_API_Move.user.js

          git add Sideline_API_Move.user.js README.md
          git diff --cached --check
          git commit -m "feat(sideline): add Live move delay toggle"
          git push origin HEAD:main

      - name: Sync Sideline to work-laptop pack
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work-laptop-pack
          main_short="$(git rev-parse --short=7 HEAD)"
          worktree="$(mktemp -d)"
          git worktree add -b sideline-pack-sync "$worktree" origin/work-laptop-pack

          # Pack is known to be behind on v0.3.8. Refuse to overwrite anything unexpected/newer.
          test "$(git -C "$worktree" hash-object 01_Sideline.txt)" = "8a4b9dbe80dc351fee34904f38c7f930e587e3d2"

          cp Sideline_API_Move.user.js "$worktree/01_Sideline.txt"

          WORKTREE="$worktree" MAIN_SHORT="$main_short" python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['WORKTREE']) / 'WORK_LAPTOP_INSTALL.txt'
          text = path.read_text()

          text, n = re.subn(r'^01 Sideline v[^\n]+$', '01 Sideline v0.3.11', text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f'pack Sideline manifest row: expected 1 match, found {n}')

          text, n = re.subn(
              r'^Updater-enabled sources: main [0-9a-f]+\.$',
              f"Updater-enabled sources: main {os.environ['MAIN_SHORT']}.",
              text,
              count=1,
              flags=re.M
          )
          if n != 1:
              raise SystemExit(f'pack updater source row: expected 1 match, found {n}')

          path.write_text(text)
          PY

          node --check "$worktree/01_Sideline.txt"
          git -C "$worktree" diff --check
          grep -q "@version      0.3.11" "$worktree/01_Sideline.txt"
          grep -q '^01 Sideline v0.3.11$' "$worktree/WORK_LAPTOP_INSTALL.txt"
          grep -q "^Updater-enabled sources: main ${main_short}\.$" "$worktree/WORK_LAPTOP_INSTALL.txt"

          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 01_Sideline.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" diff --cached --check
          git -C "$worktree" commit -m "sync: Sideline API Move v0.3.11"
          git -C "$worktree" push origin HEAD:work-laptop-pack
