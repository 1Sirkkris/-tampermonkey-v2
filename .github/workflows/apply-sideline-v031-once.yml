name: Apply FC-Lite MADCAT repair

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v031-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check FC_Lite.user.js
          grep -q '@version      0.1.62' FC_Lite.user.js
          grep -q 'const matchedFnsku' FC_Lite.user.js
          grep -q 'Boolean(fnsku)' FC_Lite.user.js
          git diff --check
          git rm .github/workflows/apply-sideline-v031-once.yml
          if [ -f .github/workflows/apply-fclite-madcat-fnsku-once.yml ]; then git rm .github/workflows/apply-fclite-madcat-fnsku-once.yml; fi
          git add FC_Lite.user.js README.md
          git commit -m "fix(fclite): resolve MADCAT FNSKU from tote inventory"
          git push origin HEAD:main
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b fclite-madcat-pack "$worktree" origin/work-laptop-pack
          cp FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          cp "$worktree/05_FC-Lite.txt" /tmp/fclite-check.js
          node --check /tmp/fclite-check.js
          python3 -c "from pathlib import Path; p=Path('$worktree/WORK_LAPTOP_INSTALL.txt'); s=p.read_text(); old=next((x for x in ('05 FC-Lite v0.1.61','05 FC-Lite v0.1.60','05 FC-Lite v0.1.59') if x in s),None); old or (_ for _ in ()).throw(SystemExit('pack row missing')); p.write_text(s.replace(old,'05 FC-Lite v0.1.62',1))"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 05_FC-Lite.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "sync: FC-Lite v0.1.62"
          git -C "$worktree" push origin HEAD:work-laptop-pack
