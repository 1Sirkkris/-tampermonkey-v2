name: Apply Sideline v0.3.15 scrub once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v0315-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scrub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          test "$(git hash-object Sideline_API_Move.user.js)" = "b0ce9fa6383b9cac63fd86ee702dcacf7588ebd6"
          sed -i "s/rep(cleanup, '', 'reset\/stop cleanup', count=2)/rep(cleanup, '', 'reset\/stop cleanup', count=3)/" .github/scripts/apply_sideline_v0315.py
          python .github/scripts/apply_sideline_v0315.py
          node --check Sideline_API_Move.user.js
          git diff --check
          ! grep -Eq 'oneByOne|oneInFlight|oneResult|oneError|OneByOne|1×1|sh-live-one|data-live-one-result' Sideline_API_Move.user.js
          grep -q '@version      0.3.15' Sideline_API_Move.user.js
          grep -q 'data-live-a="delay"' Sideline_API_Move.user.js
          grep -q 'const LIVE_LOOKUP_CONCURRENCY = 3;' Sideline_API_Move.user.js
          grep -q 'const LOOKUP_CONCURRENCY = 5;' Sideline_API_Move.user.js
          git add Sideline_API_Move.user.js
          git diff --cached --check
          git commit -m "refactor(sideline): remove redundant Live 1x1 mode"
          git push origin HEAD:main
