name: Apply Sideline v0.3.2 hazmat safety patch once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v032-hazmat-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate, publish, sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "d4dc8760c023663f25bab885d84df1f695c4be0d"
          cp Sideline_API_Move.user.js /tmp/sideline-v031.js
          python3 .github/scripts/apply_sideline_v032.py
          node --check Sideline_API_Move.user.js

          node <<'NODE'
          const clean = v => String(v ?? '').trim();
          function hasHazmat(value) {
            const seen = new Set();
            const hazardKey = key => /hazmat|dangerous.?goods/i.test(clean(key));
            const negative = /^(?:false|no|none|null|unknown|not[_ -]?hazmat|non[_ -]?hazmat|not[_ -]?dangerous(?:[_ -]?goods)?|non[_ -]?dangerous(?:[_ -]?goods)?)$/i;
            const walk = (node, key='') => {
              if (node == null) return false;
              if (typeof node === 'boolean') return hazardKey(key) && node === true;
              if (typeof node === 'number') return hazardKey(key) && node > 0;
              if (typeof node === 'string') {
                const valueText = clean(node);
                if (!valueText || negative.test(valueText)) return false;
                if (/\bHAZMAT\b/i.test(valueText) && !/\b(?:NOT|NON)[ _-]?HAZMAT\b/i.test(valueText)) return true;
                if (/\bDANGEROUS[ _-]?GOODS\b/i.test(valueText) && !/\b(?:NOT|NON)[ _-]?DANGEROUS[ _-]?GOODS\b/i.test(valueText)) return true;
                return hazardKey(key);
              }
              if (typeof node !== 'object') return false;
              if (seen.has(node)) return false;
              seen.add(node);
              if (Array.isArray(node)) return node.some(child => walk(child, key));
              return Object.entries(node).some(([childKey, child]) => walk(child, childKey));
            };
            return walk(value);
          }
          const fixtures = [
            [{hazmat:false}, false],
            [{hazmat:'false'}, false],
            [{hazmat:true}, true],
            [{type:'HAZMAT'}, true],
            [{restriction:'NOT_HAZMAT'}, false],
            [{dangerousGoods:false}, false],
            [{dangerousGoods:true}, true],
            [{reason:{'@type':'RAFilterResultReason', type:'HAZMAT'}}, true],
          ];
          for (const [value, expected] of fixtures) {
            if (hasHazmat(value) !== expected) throw new Error(`hazmat fixture failed: ${JSON.stringify(value)}`);
          }
          NODE

          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/sideline-v031.js').read_text(encoding='utf-8')
          text = Path('Sideline_API_Move.user.js').read_text(encoding='utf-8')

          def section(source, start, end):
              return source[source.index(start):source.index(end)]

          one = section(text, '  async function moveOneByOneResolved', '  async function processOneByOneBarcode')
          assert one.index("if (reason === 'HAZMAT' || hasHazmat(response)") < one.index('if (moveOk(response))')

          scan = section(text, '  async function processOneByOneBarcode', '  function enqueueOneByOneBarcode')
          assert scan.index("showOneByOneError(item, 'HAZMAT', 'HAZMAT — ITEM NOT MOVED');") < scan.index('await moveOneByOneResolved')

          live_move = section(text, '  async function liveMoveCurrent', '  async function retryLiveCurrentMove')
          assert live_move.index("if (reason === 'HAZMAT' || hasHazmat(response)") < live_move.index('if (moveOk(response))')

          live_scan = section(text, '  async function processLiveCurrent', '  async function pumpLive')
          assert live_scan.index("failLiveItem(item, 'HAZMAT — ITEM NOT MOVED', 'HAZMAT', ctx);") < live_scan.index('await liveMoveCurrent(item, ctx, null);')

          # Preserve Lazy-specific state, queue/history representation, and control functions byte-for-byte.
          lazy_state_start = '  const lazy = {'
          lazy_state_end = '  const lazyPanel = panel('
          if section(old, lazy_state_start, lazy_state_end) != section(text, lazy_state_start, lazy_state_end):
              raise SystemExit('Lazy state changed unexpectedly')

          for start, end, label in [
              ('  function parseItems(', '  function refreshItems(', 'Lazy queue parser'),
              ('  function resetLazy(', '  function stopLazyForModeSwitch(', 'Lazy reset'),
              ('  async function startLazy(', '  function stopLazy(', 'Lazy start'),
          ]:
              if section(old, start, end) != section(text, start, end):
                  raise SystemExit(f'{label} changed unexpectedly')
          PY

          rm .github/scripts/apply_sideline_v032.py
          rm .github/workflows/apply-sideline-v032-hazmat-once.yml
          git add Sideline_API_Move.user.js README.md .github/scripts/apply_sideline_v032.py .github/workflows/apply-sideline-v032-hazmat-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(sideline): block hazmat before move success"
          git push origin main

          main_sha="$(git rev-parse HEAD)"
          git checkout work-laptop-pack
          git pull --rebase origin work-laptop-pack
          git show "${main_sha}:Sideline_API_Move.user.js" > 01_Sideline.txt
          git add 01_Sideline.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "sync: Sideline v0.3.2 to work-laptop-pack"
            git push origin work-laptop-pack
          fi
