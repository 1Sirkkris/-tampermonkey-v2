name: Apply Sideline v0.3.2 hazmat safety patch once

# trigger after workflow registration
on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v032-hazmat-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate, publish, sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "d4dc8760c023663f25bab885d84df1f695c4be0d"
          cp Sideline_API_Move.user.js /tmp/sideline-v031.js
          python3 .github/scripts/apply_sideline_v032.py
          node --check Sideline_API_Move.user.js

          node <<'NODE'
          const clean = v => String(v ?? '').trim();
          function hasHazmat(value) {
            const seen = new Set();
            const hazardKey = key => /hazmat|dangerous.?goods/i.test(clean(key));
            const negative = /^(?:false|no|none|null|unknown|not[_ -]?hazmat|non[_ -]?hazmat|not[_ -]?dangerous(?:[_ -]?goods)?|non[_ -]?dangerous(?:[_ -]?goods)?)$/i;
            const walk = (node, key='') => {
              if (node == null) return false;
              if (typeof node === 'boolean') return hazardKey(key) && node === true;
              if (typeof node === 'number') return hazardKey(key) && node > 0;
              if (typeof node === 'string') {
                const valueText = clean(node);
                if (!valueText || negative.test(valueText)) return false;
                if (/\bHAZMAT\b/i.test(valueText) && !/\b(?:NOT|NON)[ _-]?HAZMAT\b/i.test(valueText)) return true;
                if (/\bDANGEROUS[ _-]?GOODS\b/i.test(valueText) && !/\b(?:NOT|NON)[ _-]?DANGEROUS[ _-]?GOODS\b/i.test(valueText)) return true;
                return hazardKey(key);
              }
              if (typeof node !== 'object') return false;
              if (seen.has(node)) return false;
              seen.add(node);
              if (Array.isArray(node)) return node.some(child => walk(child, key));
              return Object.entries(node).some(([childKey, child]) => walk(child, childKey));
            };
            return walk(value);
          }

          const fixtures = [
            [{hazmat:false}, false],
            [{hazmat:'false'}, false],
            [{hazmat:true}, true],
            [{type:'HAZMAT'}, true],
            [{restriction:'NOT_HAZMAT'}, false],
            [{dangerousGoods:false}, false],
            [{dangerousGoods:true}, true],
            [{reason:{'@type':'RAFilterResultReason', type:'HAZMAT'}}, true],
          ];
          for (const [value, expected] of fixtures) {
            const actual = hasHazmat(value);
            if (actual !== expected) throw new Error(`hazmat fixture failed: ${JSON.stringify(value)} => ${actual}, expected ${expected}`);
          }
          NODE

          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/sideline-v031.js').read_text(encoding='utf-8')
          new = Path('Sideline_API_Move.user.js').read_text(encoding='utf-8')

          def section(text, start, end):
              return text[text.index(start):text.index(end)]

          lazy_start = '  // Lazy\n'
          if old[old.index(lazy_start):] != new[new.index(lazy_start):]:
              raise SystemExit('Lazy implementation changed unexpectedly')

          one = section(new, '  async function moveOneByOneResolved', '  async function processOneByOneBarcode')
          if one.index("if (reason === 'HAZMAT' || hasHazmat(response)") > one.index('if (moveOk(response))'):
              raise SystemExit('1x1 Hazmat response guard occurs after success')

          scan = section(new, '  async function processOneByOneBarcode', '  function enqueueOneByOneBarcode')
          if scan.index("showOneByOneError(item, 'HAZMAT', 'HAZMAT — ITEM NOT MOVED');") > scan.index('await moveOneByOneResolved'):
              raise SystemExit('1x1 pre-move Hazmat guard occurs after move request')

          live_move = section(new, '  async function liveMoveCurrent', '  async function retryLiveCurrentMove')
          if live_move.index("if (reason === 'HAZMAT' || hasHazmat(response)") > live_move.index('if (moveOk(response))'):
              raise SystemExit('Live Hazmat response guard occurs after success')

          live_scan = section(new, '  async function processLiveCurrent', '  async function pumpLive')
          if live_scan.index("failLiveItem(item, 'HAZMAT — ITEM NOT MOVED', 'HAZMAT', ctx);") > live_scan.index('await liveMoveCurrent(item, ctx, null);'):
              raise SystemExit('Live pre-move Hazmat guard occurs after move request')
          PY

          rm .github/scripts/apply_sideline_v032.py
          rm .github/workflows/apply-sideline-v032-hazmat-once.yml
          git add Sideline_API_Move.user.js README.md .github/scripts/apply_sideline_v032.py .github/workflows/apply-sideline-v032-hazmat-once.yml
          git diff --cached --check
          git commit -m "fix(sideline): block hazmat before move success"
          git push origin main

          main_sha="$(git rev-parse HEAD)"
          git checkout work-laptop-pack
          git pull --rebase origin work-laptop-pack
          git show "${main_sha}:Sideline_API_Move.user.js" > 01_Sideline.txt
          git add 01_Sideline.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "sync: Sideline v0.3.2 to work-laptop-pack"
            git push origin work-laptop-pack
          fi
