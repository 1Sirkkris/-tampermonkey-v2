name: Apply Sideline v0.3.3 Live hazmat safety patch once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v033-hazmat-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate, publish, sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "fc2cc9ebd7834c7db3f1c34cdd5f9f3b62d3a31d"
          cp Sideline_API_Move.user.js /tmp/sideline-v032.js
          python3 .github/scripts/apply_sideline_v033.py
          node --check Sideline_API_Move.user.js

          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/sideline-v032.js').read_text(encoding='utf-8')
          new = Path('Sideline_API_Move.user.js').read_text(encoding='utf-8')

          def section(text, start, end):
              a = text.index(start)
              b = text.index(end, a + len(start))
              return text[a:b]

          preflight = section(new, '  function preflightLiveLookup(', '  function scheduleLiveLookup(')
          hazmat = preflight.index('if (hasHazmat(result.response)) {')
          date = preflight.index("if (ctx.dateType === 'EXPIRATION_DATE' || ctx.dateType === 'PRODUCTION_DATE')")
          ready = preflight.index("item.preflightStatus = 'READY';")
          assert hazmat < date < ready
          assert "autoSkipQueuedLiveItem(item, 'HAZMAT — ITEM NOT MOVED', 'HAZMAT')" in preflight

          one_old = section(old, '  function showOneByOneError(', '  function enqueueOneByOneBarcode(')
          one_new = section(new, '  function showOneByOneError(', '  function enqueueOneByOneBarcode(')
          if one_old != one_new:
              raise SystemExit('1x1 implementation changed unexpectedly')

          lazy_old = old[old.index('  // Lazy\n'):]
          lazy_new = new[new.index('  // Lazy\n'):]
          if lazy_old != lazy_new:
              raise SystemExit('Lazy implementation changed unexpectedly')

          live_move = section(new, '  async function liveMoveCurrent(', '  async function retryLiveCurrentMove(')
          assert live_move.index("if (reason === 'HAZMAT' || hasHazmat(response)") < live_move.index('if (moveOk(response))')

          scan = section(new, '  async function processOneByOneBarcode(', '  function enqueueOneByOneBarcode(')
          assert scan.index("showOneByOneError(item, 'HAZMAT', 'HAZMAT — ITEM NOT MOVED');") < scan.index('await moveOneByOneResolved')
          PY

          git diff -- Sideline_API_Move.user.js README.md
          rm .github/scripts/apply_sideline_v033.py
          rm .github/workflows/apply-sideline-v033-hazmat-once.yml
          git add Sideline_API_Move.user.js README.md .github/scripts/apply_sideline_v033.py .github/workflows/apply-sideline-v033-hazmat-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(sideline): reject hazmat during Live preflight"
          git push origin main

          main_sha="$(git rev-parse HEAD)"
          git checkout work-laptop-pack
          git pull --rebase origin work-laptop-pack
          git show "${main_sha}:Sideline_API_Move.user.js" > 01_Sideline.txt
          git add 01_Sideline.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "sync: Sideline v0.3.3 to work-laptop-pack"
            git push origin work-laptop-pack
          fi
