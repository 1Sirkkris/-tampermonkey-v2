name: Apply Sideline v0.3.5 return-source isolation once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v035-return-source-isolation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate, publish, sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "92005885fc4a4ad5d4b454cfe635ed266fbaf9a2"
          cp Sideline_API_Move.user.js /tmp/sideline-v034.js
          python3 .github/scripts/apply_sideline_v035_return_source_isolation.py
          python3 .github/scripts/fix_sideline_v035_owner_isolation.py
          node --check Sideline_API_Move.user.js

          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/sideline-v034.js').read_text(encoding='utf-8')
          new = Path('Sideline_API_Move.user.js').read_text(encoding='utf-8')
          def section(text, start, end):
              a = text.index(start)
              b = text.index(end, a + len(start))
              return text[a:b]
          required = [
              "// @version      0.3.5",
              "const VERSION = '0.3.5';",
              "root.dataset.owner = owner === live ? 'live' : 'lazy';",
              'function returnModeFromButton(button)',
              "universalReturnToSource(returnModeFromButton(button));",
              "data-return-source>↩ Return to Source</button>",
              "data-return-source>↩ RETURN TO SOURCE</button>",
          ]
          for needle in required:
              if needle not in new:
                  raise SystemExit(f'missing return-source invariant: {needle}')
          panel_fn = section(new, '  function panel(', '  function savePanelStates(')
          assert 'data-return-source' in panel_fn
          api_date = section(new, '  function showApiDatePicker(', '  function nativeExpiryInputs(')
          assert "root.dataset.owner = owner === live ? 'live' : 'lazy';" in api_date
          assert 'og-return-source' in api_date
          native_date = section(new, '  function showNativeExpiryPicker(', '  function nativeExpiryTick(')
          assert 'og-return-source' in native_date
          router = section(new, '  function returnModeFromButton(button)', '  function returnSourceCodeForMode(mode)')
          for target in ['#sh-live', '#sh-lazy', '#sh-queue', '#sh-scrub', '#sh-qty']:
              assert target in router, target
          universal = section(new, "  async function universalReturnToSource(mode='native')", '  function handleUniversalReturnClick(')
          for branch in ["if (mode === 'queue')", "else if (mode === 'scrub')", "else if (mode === 'qty')", "else if (mode === 'live')", "else if (mode === 'lazy')"]:
              assert branch in universal, branch
          assert 'const ownerWasTarget' in universal
          assert "stopLiveForReturn('returned to source');" in universal
          assert "stopLazyForReturn('returned to source — current item abandoned');" in universal
          lazy_return = section(new, '  function stopLazyForReturn(note)', '  async function returnNativeToSourceContainer(')
          assert 'const wasActive = !!(' in lazy_return
          assert 'const current = wasActive ? lazy.items[lazy.index] : null;' in lazy_return
          for forbidden in ['lazy.items = []', 'lazy.deferred = []', "lItems.value = ''", "lSrc.value = ''", "lDest.value = ''"]:
              if forbidden in lazy_return:
                  raise SystemExit(f'Lazy escape unexpectedly clears state: {forbidden}')
          live_return = section(new, '  function stopLiveForReturn(note)', '  function stopLazyForReturn(note)')
          for required_live in ['live.queue = [];', 'live.current = null;', 'live.datePending = [];', 'live.issue = null;']:
              assert required_live in live_return, required_live
          for forbidden in ['live.history = []', 'live.moved = 0', 'live.skipped = 0']:
              if forbidden in live_return:
                  raise SystemExit(f'Live escape unexpectedly clears completed history/counter: {forbidden}')
          for needle in [
              "showOneByOneError(item, 'HAZMAT', 'HAZMAT — ITEM NOT MOVED');",
              "if (hasHazmat(result.response)) {",
              "autoSkipQueuedLiveItem(item, 'HAZMAT — ITEM NOT MOVED', 'HAZMAT')",
              'if (!await waitForLiveMovePace(item, run)) return false;',
          ]:
              if needle not in new:
                  raise SystemExit(f'existing safety contract missing: {needle}')
          for start, end, label in [
              ('  function buildMovePayload(', '  function liveItemMeta(', 'move payload'),
              ('  function hasHazmat(', '  function hasMoveProblems(', 'hazmat parser'),
          ]:
              if section(old, start, end) != section(new, start, end):
                  raise SystemExit(f'{label} changed unexpectedly')
          PY

          git diff --check
          git diff -- Sideline_API_Move.user.js README.md

          rm .github/scripts/apply_sideline_v035_return_source_isolation.py
          rm .github/scripts/fix_sideline_v035_owner_isolation.py
          rm .github/workflows/apply-sideline-v035-return-source-isolation-once.yml
          git add Sideline_API_Move.user.js README.md .github/scripts/apply_sideline_v035_return_source_isolation.py .github/scripts/fix_sideline_v035_owner_isolation.py .github/workflows/apply-sideline-v035-return-source-isolation-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(sideline): isolate return-to-source by mode"
          git push origin main

          main_sha="$(git rev-parse HEAD)"
          git checkout work-laptop-pack
          git pull --rebase origin work-laptop-pack
          git show "${main_sha}:Sideline_API_Move.user.js" > 01_Sideline.txt
          cp 01_Sideline.txt /tmp/01_Sideline.js
          node --check /tmp/01_Sideline.js
          git add 01_Sideline.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "sync(sideline): deploy v0.3.5 to laptop pack"
            git push origin work-laptop-pack
          fi
