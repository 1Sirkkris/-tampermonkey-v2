name: Apply Sideline v0.3.7 expiry Hazmat fix once

on:
  push:
    paths:
      - '.github/workflows/apply-sideline-v037-expiry-hazmat-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate Sideline v0.3.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          git pull --rebase origin main

          test "$(git hash-object Sideline_API_Move.user.js)" = "1f77915d818629ee6979a6181ad07a0bafd1456e"
          cp Sideline_API_Move.user.js /tmp/sideline-v036.js

          python3 .github/scripts/apply_sideline_v037_expiry_hazmat.py
          node --check Sideline_API_Move.user.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          old = Path('/tmp/sideline-v036.js').read_text(encoding='utf-8')
          new = Path('Sideline_API_Move.user.js').read_text(encoding='utf-8')

          def section(text, start, end):
              a = text.index(start)
              b = text.index(end, a + len(start))
              return text[a:b]

          required = [
              "// @version      0.3.7",
              "const VERSION = '0.3.7';",
              'function isHazmatRejectionResponse(response)',
              "key === 'lazy' || key === 'live'",
              'og-footer og-footer-single',
              'isHazmatRejectionResponse(error?.payload)',
              'isHazmatRejectionResponse(response)',
          ]
          for needle in required:
              if needle not in new:
                  raise SystemExit(f'missing v0.3.7 invariant: {needle}')

          # Expiry stays ahead of any move, and scan/product Hazmat metadata no longer auto-skips.
          one = section(new, '  async function processOneByOneBarcode(', '  function enqueueOneByOneBarcode(')
          if "showOneByOneError(item, 'HAZMAT', 'HAZMAT — ITEM NOT MOVED');" in one:
              raise SystemExit('1x1 still hard-skips scan metadata Hazmat')
          if one.index("ctx.dateType === 'EXPIRATION_DATE'") > one.index('await moveOneByOneResolved'):
              raise SystemExit('1x1 expiry no longer precedes move')

          live = section(new, '  async function processLiveCurrent(', '  async function pumpLive(')
          if "failLiveItem(item, 'HAZMAT — ITEM NOT MOVED', 'HAZMAT', ctx);" in live:
              raise SystemExit('Live still hard-skips scan metadata Hazmat')
          if live.index("ctx.dateType === 'EXPIRATION_DATE'") > live.index('await liveMoveCurrent(item, ctx, null)'):
              raise SystemExit('Live expiry no longer precedes move')

          preflight = section(new, '  function preflightLiveLookup(', '  function scheduleLiveLookup(')
          if 'hasHazmat(result.response)' in preflight:
              raise SystemExit('Live preflight still hard-skips product Hazmat metadata')

          # Actual move rejection still has Hazmat hard-stop handling.
          one_move = section(new, '  async function moveOneByOneResolved(', '  async function processOneByOneBarcode(')
          live_move = section(new, '  async function liveMoveCurrent(', '  async function retryLiveCurrentMove(')
          for label, block in [('1x1', one_move), ('Live', live_move)]:
              if 'isHazmatRejectionResponse(response)' not in block:
                  raise SystemExit(f'{label} lost move-response Hazmat rejection handling')
              if 'HAZMAT — ITEM NOT MOVED' not in block:
                  raise SystemExit(f'{label} lost visible Hazmat failure')

          # Overage remains accepted, but no special Overage message is rendered.
          if 'OVERAGE OK —' in new:
              raise SystemExit('Overage still has special user-facing UI text')
          if 'function isAllowedOverageResponse(response)' not in new or 'if (isAllowedOverageResponse(response)) return true;' not in new:
              raise SystemExit('Overage acceptance behavior was removed')

          # Return-to-source visible controls are scoped to Lazy / Live / 1x1 and their API date picker.
          panel = section(new, '  function panel(', '  function savePanelStates(')
          if "key === 'lazy' || key === 'live'" not in panel:
              raise SystemExit('panel return-source scope missing')
          native_idx = new.index('data-role="native-product-image"')
          native_block = new[native_idx:new.index('function nativeExpiryInputs', native_idx) if 'function nativeExpiryInputs' in new[native_idx:] else native_idx+8000]
          if 'data-return-source' in native_block:
              raise SystemExit('native/QTY expiry still exposes Return to Source')

          # Move payload contract and Overage classifier are otherwise preserved except Hazmat rejection semantics.
          if section(old, '  function buildMovePayload(', '  function liveItemMeta(') != section(new, '  function buildMovePayload(', '  function liveItemMeta('):
              raise SystemExit('move payload changed unexpectedly')
          PY

          git diff -- Sideline_API_Move.user.js README.md

          rm .github/scripts/apply_sideline_v037_expiry_hazmat.py
          rm .github/workflows/apply-sideline-v037-expiry-hazmat-once.yml
          git add Sideline_API_Move.user.js README.md .github/scripts/apply_sideline_v037_expiry_hazmat.py .github/workflows/apply-sideline-v037-expiry-hazmat-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(sideline): prioritize expiry over Hazmat metadata"
          git push origin main

          main_sha="$(git rev-parse HEAD)"
          git checkout work-laptop-pack
          git pull --rebase origin work-laptop-pack
          git show "${main_sha}:Sideline_API_Move.user.js" > 01_Sideline.txt
          cp 01_Sideline.txt /tmp/01_Sideline.js
          node --check /tmp/01_Sideline.js
          git add 01_Sideline.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "sync(sideline): deploy v0.3.7 to laptop pack"
            git push origin work-laptop-pack
          fi