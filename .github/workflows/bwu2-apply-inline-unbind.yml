name: Apply approved inline Unbind

on:
  push:
    branches: [main]
    paths:
      - '.github/bwu2_apply_inline_unbind.py'
      - '.github/workflows/bwu2-apply-inline-unbind.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped Stow patch
        run: python3 .github/bwu2_apply_inline_unbind.py

      - name: Static and scope checks
        shell: bash
        run: |
          node --check Stow_Andons_Helper.user.js
          git diff --check
          grep -F '// @version      5.5.5' Stow_Andons_Helper.user.js
          grep -F "const VERSION = '5.5.5';" Stow_Andons_Helper.user.js
          grep -F '// @connect      tx-b-hierarchy-nrt.nrt.proxy.amazon.com' Stow_Andons_Helper.user.js
          grep -F 'data-unbind' Stow_Andons_Helper.user.js
          grep -F '| Stow Andons Helper | 5.5.5 |' README.md
          ! grep -F "document.addEventListener('focusin'" Stow_Andons_Helper.user.js

      - name: Commit approved change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/bwu2_apply_inline_unbind.py .github/workflows/bwu2-apply-inline-unbind.yml
          git add Stow_Andons_Helper.user.js README.md
          git diff --cached --check
          git commit -m 'feat(stow): restore inline hierarchy unbind'
          git push origin main
