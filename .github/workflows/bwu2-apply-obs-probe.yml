name: Apply approved OBS MoveItems probe

on:
  push:
    branches: [main]
    paths:
      - '.github/bwu2_apply_obs_probe.py'
      - '.github/workflows/bwu2-apply-obs-probe.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped userscript changes
        run: python3 .github/bwu2_apply_obs_probe.py

      - name: Static syntax and scope checks
        shell: bash
        run: |
          node --check BWU2_Observability_Core.user.js
          git diff --check
          grep -F '// @version      0.1.14' BWU2_Observability_Core.user.js
          grep -F "const VERSION = '0.1.14';" BWU2_Observability_Core.user.js
          grep -F '| BWU2 Observability Core | 0.1.14 |' README.md

      - name: Commit approved changes and remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/bwu2_apply_obs_probe.py .github/workflows/bwu2-apply-obs-probe.yml
          git add BWU2_Observability_Core.user.js README.md
          git diff --cached --check
          git commit -m 'feat(observability): probe AFT MoveItems quantity signals'
          git push origin main
