name: Apply approved Sideline and Unbind fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bwu2-apply-sideline-unbind.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped userscript changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/bwu2_patch.py
          python3 /tmp/bwu2_patch.py

      - name: Static syntax check
        run: |
          node --check Sideline_API_Move.user.js
          node --check Unbind_Hierarchy_Queue.user.js
          git diff --check

      - name: Commit approved changes and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bwu2-apply-sideline-unbind.yml
          git add Sideline_API_Move.user.js Unbind_Hierarchy_Queue.user.js README.md
          git commit -m 'fix: handle Sideline overage and recover Unbind sessions'
          git push origin main
