name: Apply approved Sideline and Unbind fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bwu2-apply-sideline-unbind.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped userscript changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # --- Sideline ---
          p = Path('Sideline_API_Move.user.js')
          s = p.read_text()
          s = replace_once(s, '// @version      0.3.17', '// @version      0.3.18', 'sideline metadata version')
          s = replace_once(s, "const VERSION = '0.3.17';", "const VERSION = '0.3.18';", 'sideline runtime version')

          old = """  function changeButton() {
            const direct = $('#change-container-button');
            return enabled(direct) && !direct.closest(helperSelector) ? direct : buttonByText(/change container/);
          }
"""
          new = old + """
          function containerOverageButton() {
            return buttonByText(/\\bcontainer overage\\b/);
          }
"""
          s = replace_once(s, old, new, 'sideline overage button detector')

          old = """  async function closeOpenContainer(choice='yes', active=()=>true) {
            const change = await waitFor(() => active() && changeButton(), 12000, 35);
            if (!change || !active()) return 'cancelled';
            click(change);
            const answer = await waitFor(() => active() && modalButton(choice), 3500, 25);
            if (!answer || !active()) return 'cancelled';
            click(answer);
            if (!active()) return 'cancelled';
            return await waitFor(() => active() && screen() === 'SOURCE' && scanInput(), 12000, 50) ? 'closed' : 'source timeout';
          }
"""
          new = """  async function closeOpenContainer(choice='yes', active=()=>true) {
            const action = await waitFor(() => active() && (changeButton() || containerOverageButton()), 12000, 35);
            if (!action || !active()) return 'cancelled';

            const overage = /\\bcontainer overage\\b/.test(buttonLabel(action));
            click(action);

            if (overage) {
              if (!active()) return 'cancelled';
              return await waitFor(() => active() && screen() === 'SOURCE' && scanInput(), 12000, 50)
                ? 'overage'
                : 'overage timeout';
            }

            const answer = await waitFor(() => active() && modalButton(choice), 3500, 25);
            if (!answer || !active()) return 'cancelled';
            click(answer);
            if (!active()) return 'cancelled';
            return await waitFor(() => active() && screen() === 'SOURCE' && scanInput(), 12000, 50) ? 'closed' : 'source timeout';
          }
"""
          s = replace_once(s, old, new, 'sideline close/overage branch')

          old = """      const result = await closeOpenContainer('yes');
              if (result !== 'closed') throw new Error(result);
              qtyStatus.textContent = 'Current tote cleared';
"""
          new = """      const result = await closeOpenContainer('yes');
              if (result !== 'closed' && result !== 'overage') throw new Error(result);
              qtyStatus.textContent = result === 'overage'
                ? 'Container overage created — scan next tote'
                : 'Current tote cleared';
"""
          s = replace_once(s, old, new, 'sideline qty clear result')
          p.write_text(s)

          # --- Unbind ---
          p = Path('Unbind_Hierarchy_Queue.user.js')
          u = p.read_text()
          u = replace_once(u, '// @version      1.0.4', '// @version      1.0.5', 'unbind metadata version')
          u = replace_once(u, "const VERSION = '1.0.4';", "const VERSION = '1.0.5';", 'unbind runtime version')

          old = """  const MINIMIZED_KEY = 'bwu2.unbindQueue.minimized.v1';
"""
          new = old + """  const SESSION_RECOVERY_KEY = 'bwu2.unbindQueue.sessionRecovery.v1';
          const SESSION_RECOVERY_MAX_AGE_MS = 60 * 1000;
          const SESSION_RECOVERY_MAX_ATTEMPTS = 2;
"""
          u = replace_once(u, old, new, 'unbind recovery constants')

          old = """  function saveMinimized() {
            try { localStorage.setItem(MINIMIZED_KEY, minimized ? '1' : '0'); } catch (_) {}
          }
"""
          new = old + """
          function readSessionRecovery() {
            try {
              const value = JSON.parse(localStorage.getItem(SESSION_RECOVERY_KEY) || 'null');
              if (!value || !Number(value.at)) return null;
              if (Date.now() - Number(value.at) > SESSION_RECOVERY_MAX_AGE_MS) {
                localStorage.removeItem(SESSION_RECOVERY_KEY);
                return null;
              }
              return value;
            } catch (_) {
              return null;
            }
          }

          function saveSessionRecovery(value) {
            try { localStorage.setItem(SESSION_RECOVERY_KEY, JSON.stringify(value)); } catch (_) {}
          }

          function clearSessionRecovery() {
            try { localStorage.removeItem(SESSION_RECOVERY_KEY); } catch (_) {}
          }

          function persistLogin(value) {
            const login = normalizeLogin(value);
            if (!login) return '';
            try { localStorage.setItem(LOGIN_KEY, login); } catch (_) {}
            return login;
          }
"""
          u = replace_once(u, old, new, 'unbind persistence helpers')

          old = """  function currentLogin() {
            return normalizeLogin(ui.login?.value || discoverLogin());
          }

          function saveLogin() {
            const login = currentLogin();
            if (!login) return '';
            try { localStorage.setItem(LOGIN_KEY, login); } catch (_) {}
            if (ui.login) ui.login.value = login;
            return login;
          }
"""
          new = """  function currentLogin() {
            return persistLogin(ui.login?.value || discoverLogin());
          }

          function saveLogin() {
            const login = currentLogin();
            if (!login) return '';
            if (ui.login) ui.login.value = login;
            return login;
          }
"""
          u = replace_once(u, old, new, 'unbind login persistence')

          old = """      return { data, status: response.status, ms };
"""
          new = """      if (phase !== 'unbind' && readSessionRecovery()?.resume) clearSessionRecovery();
              return { data, status: response.status, ms };
"""
          u = replace_once(u, old, new, 'unbind recovery clear on success')

          old = """    if (error?.sessionExpired) {
              item.status = 'queued';
              item.phase = '';
              item.error = '';
              item.ms = 0;
              state.currentId = '';
              state.phase = 'idle';
              state.running = false;
              state.message = 'SESSION EXPIRED — queue preserved; refresh page, then press START';
              releaseLock();
              saveState();
              render();
              trace('UNBIND_QUEUE_SESSION_EXPIRED', { container: item.id, phase: clean(error.phase) });
              return;
            }
"""
          new = """    if (error?.sessionExpired) {
              const phase = clean(error.phase);
              const previous = readSessionRecovery();
              const attempts = previous?.resume ? Math.max(1, Number(previous.attempts) || 1) + 1 : 1;

              state.currentId = '';
              state.phase = 'idle';
              state.running = false;
              releaseLock();

              if (phase === 'unbind') {
                item.status = 'attention';
                item.phase = 'unbind';
                item.error = 'Session expired during unbind — verify container before retrying';
                saveSessionRecovery({
                  at: Date.now(),
                  resume: false,
                  ambiguous: true,
                  container: item.id,
                  phase
                });
                state.message = 'SESSION EXPIRED DURING UNBIND — refreshing automatically; verify attention row';
                saveState();
                render();
                trace('UNBIND_QUEUE_SESSION_EXPIRED', { container: item.id, phase, autoRefresh: true, resume: false });
                queueMicrotask(() => location.reload());
                return;
              }

              item.status = 'queued';
              item.phase = '';
              item.error = '';
              item.ms = 0;

              if (attempts > SESSION_RECOVERY_MAX_ATTEMPTS) {
                clearSessionRecovery();
                state.message = 'SESSION STILL EXPIRED — queue preserved; sign in again if required';
                saveState();
                render();
                trace('UNBIND_QUEUE_SESSION_EXPIRED', { container: item.id, phase, autoRefresh: false, attempts });
                return;
              }

              saveSessionRecovery({
                at: Date.now(),
                resume: true,
                attempts,
                container: item.id,
                phase
              });
              state.message = `SESSION EXPIRED — refreshing automatically (${attempts}/${SESSION_RECOVERY_MAX_ATTEMPTS})`;
              saveState();
              render();
              trace('UNBIND_QUEUE_SESSION_EXPIRED', { container: item.id, phase, autoRefresh: true, resume: true, attempts });
              queueMicrotask(() => location.reload());
              return;
            }
"""
          u = replace_once(u, old, new, 'unbind session expiry recovery')

          marker = """  function startQueue() {
"""
          insert = """  function resumeAfterSessionReload() {
            const recovery = readSessionRecovery();
            if (!recovery) return;

            if (!recovery.resume) {
              clearSessionRecovery();
              state.message = 'Session refreshed — verify attention row before retrying';
              saveState();
              render();
              return;
            }

            const login = saveLogin();
            if (!login) {
              clearSessionRecovery();
              state.message = 'Session refreshed — enter employee login once';
              saveState();
              render();
              ui.login?.focus();
              return;
            }

            if (!acquireLock()) {
              state.message = 'Session refreshed — another tab owns the Unbind queue';
              saveState();
              render();
              return;
            }

            state.running = true;
            state.message = 'SESSION REFRESHED — resuming queue';
            saveState();
            render();
            trace('UNBIND_QUEUE_SESSION_RESUME', {
              container: clean(recovery.container),
              phase: clean(recovery.phase),
              attempts: Number(recovery.attempts) || 1
            });
            queueMicrotask(runQueue);
          }

""" + marker
          u = replace_once(u, marker, insert, 'unbind auto-resume function')

          old = """    ui.login.addEventListener('change', () => { saveLogin(); render(); });
"""
          new = """    ui.login.addEventListener('input', () => { persistLogin(ui.login.value); });
              ui.login.addEventListener('change', () => { saveLogin(); render(); });
"""
          u = replace_once(u, old, new, 'unbind save login on input')

          old = """    render();
              positionUi();
              if (!minimized) setTimeout(() => ui.draft.focus(), 0);
            }
"""
          new = """    render();
              positionUi();
              if (!minimized) setTimeout(() => ui.draft.focus(), 0);
              queueMicrotask(resumeAfterSessionReload);
            }
"""
          u = replace_once(u, old, new, 'unbind auto-resume mount hook')
          p.write_text(u)

          # README fleet versions
          p = Path('README.md')
          r = p.read_text()
          r = replace_once(r, '| Sideline API Move | 0.3.17 |', '| Sideline API Move | 0.3.18 |', 'readme sideline version')
          r = replace_once(r, '| Unbind Hierarchy Queue | 1.0.4 |', '| Unbind Hierarchy Queue | 1.0.5 |', 'readme unbind version')
          p.write_text(r)
          PY

      - name: Static syntax check
        run: |
          node --check Sideline_API_Move.user.js
          node --check Unbind_Hierarchy_Queue.user.js

      - name: Commit approved changes and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bwu2-apply-sideline-unbind.yml
          git add Sideline_API_Move.user.js Unbind_Hierarchy_Queue.user.js README.md
          git commit -m 'fix: handle Sideline overage and recover Unbind sessions'
          git push origin main
