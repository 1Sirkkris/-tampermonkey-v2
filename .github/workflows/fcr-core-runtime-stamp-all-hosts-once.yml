name: one-shot FCR Core runtime stamp all hosts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fcr-core-runtime-stamp-all-hosts-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch FCR Core
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('FCR_Data_Core.user.js')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          one('// @version      0.2.19', '// @version      0.2.20', 'metadata version')
          one("  const VERSION = '0.2.19';", "  const VERSION = '0.2.20';", 'internal version')

          start = s.index("  const VERSION = '0.2.20';")
          end_marker = "  registerRuntimeVersion('FCR CORE', VERSION);\n\n"
          end = s.index(end_marker, start) + len(end_marker)
          block = s[start:end]
          helper_only = block.replace("  registerRuntimeVersion('FCR CORE', VERSION);\n\n", '')
          s = s[:start] + s[end:]

          anchor = "  'use strict';\n\n"
          if anchor not in s: raise SystemExit('strict anchor missing')
          s = s.replace(anchor, anchor + helper_only + '\n', 1)

          old_measure = "  if (location.hostname === MEASUREMENT_SITE_HOST) {\n    installMeasurementAuthBridge();\n    return;\n  }"
          new_measure = "  if (location.hostname === MEASUREMENT_SITE_HOST) {\n    registerRuntimeVersion('FCR CORE', VERSION);\n    installMeasurementAuthBridge();\n    return;\n  }"
          one(old_measure, new_measure, 'measurement host stamp')

          old_guard = "  if (window.__fcrDataCore_v0210test) return;\n  window.__fcrDataCore_v0210test = true;\n\n"
          new_guard = "  if (window.__fcrDataCore_v0210test) return;\n  window.__fcrDataCore_v0210test = true;\n  registerRuntimeVersion('FCR CORE', VERSION);\n\n"
          one(old_guard, new_guard, 'normal host stamp')

          if s.count("registerRuntimeVersion('FCR CORE', VERSION);") != 2:
              raise SystemExit('expected exactly two runtime registration paths')
          p.write_text(s)

          r = Path('README.md').read_text()
          r, n = re.subn(r'(?m)^(\| FCR Data Core \| )0\.2\.19( \| \[Open\])', r'\g<1>0.2.20\g<2>', r, count=1)
          if n != 1: raise SystemExit('README FCR row missing')
          Path('README.md').write_text(r)
          PY
          node --check FCR_Data_Core.user.js
          grep -q '@name:en      TEST FCR Data Core — MADCAT Auto Auth' FCR_Data_Core.user.js
          grep -q '@version      0.2.20' FCR_Data_Core.user.js
          grep -q "const VERSION = '0.2.20';" FCR_Data_Core.user.js
          git diff --check
      - name: Publish main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fcr-core-runtime-stamp-all-hosts-once.yml
          git add -A
          git commit -m "fix: show FCR Core runtime version on all active hosts"
          git push origin main
      - name: Sync work laptop pack
        shell: bash
        run: |
          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:FCR_Data_Core.user.js > 03_FCR_Data_Core.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('WORK_LAPTOP_INSTALL.txt')
          s=p.read_text().replace('03 FCR Data Core v0.2.19','03 FCR Data Core v0.2.20')
          p.write_text(s)
          PY
          cp 03_FCR_Data_Core.txt /tmp/check.js
          node --check /tmp/check.js
          grep -q '@version      0.2.20' 03_FCR_Data_Core.txt
          git diff --check
          git add 03_FCR_Data_Core.txt WORK_LAPTOP_INSTALL.txt
          git commit -m "deploy: sync FCR Data Core v0.2.20" || true
          git push origin work-laptop-pack
