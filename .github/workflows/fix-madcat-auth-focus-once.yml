name: Fix MADCAT auth focus once

on:
  push:
    paths:
      - '.github/workflows/fix-madcat-auth-focus-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch validate publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # Shared MADCAT core: use the token until it is genuinely expiring and never
          # open the measurement site from unrelated user clicks/Enter presses.
          path = Path('FCR_Data_Core.user.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '// @version      0.2.20', '// @version      0.2.21', 'core metadata version')
          text = replace_once(text, "const VERSION = '0.2.20';", "const VERSION = '0.2.21';", 'core runtime version')
          text = replace_once(
              text,
              '// @description  Strict binDescription plus shift-cached global 30-day raw MADCAT with automatic user-gesture auth renewal.',
              '// @description  Strict binDescription plus shift-cached global 30-day raw MADCAT with on-demand measurement auth.',
              'core description'
          )
          text = replace_once(text, 'const MEASUREMENT_TIMEOUT_MS = 6000;', 'const MEASUREMENT_TIMEOUT_MS = 10000;', 'measurement timeout')
          text = replace_once(text, 'const MEASUREMENT_RENEW_BEFORE_MS = 10 * 60 * 1000;', 'const MEASUREMENT_RENEW_BEFORE_MS = 15 * 1000;', 'renew threshold')
          text = replace_once(
              text,
              '  installMeasurementAutoRenewal();',
              '  // Auth renewal is intentionally user-triggered only; never steal focus from normal FCResearch clicks/Enter presses.',
              'disable unsolicited auto renewal'
          )
          path.write_text(text, encoding='utf-8')

          helper = """  function madcatRetryNeedsAuth(status, message = '') {
            if (status === 'history-yes' || status === 'history-no') return true;
            return status === 'error' && /(?:measurement login required|token expired|authentication required|login popup)/i.test(clean(message));
          }

"""

          # Native FCResearch MADCAT badge: a timeout/network error retries raw MADCAT
          # directly. Only an actual auth/fallback state opens the measurement bridge.
          path = Path('FCResearch_Master.user.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '// @version      0.1.28', '// @version      0.1.29', 'master metadata version')
          text = replace_once(text, "const VERSION = '0.1.28';", "const VERSION = '0.1.29';", 'master runtime version')
          text = replace_once(text, "  const madcatState = { signature: '', status: '', message: '', serial: 0 };\n\n", "  const madcatState = { signature: '', status: '', message: '', serial: 0 };\n\n" + helper, 'master retry helper')
          text = replace_once(
              text,
              "              : state === 'error' ? `${message || 'MADCAT check failed'} — click to refresh auth and retry`",
              "              : state === 'error' ? `${message || 'MADCAT check failed'} — click to ${madcatRetryNeedsAuth(state, message) ? 'refresh auth and retry' : 'retry'}`",
              'master error title'
          )
          text = replace_once(
              text,
              '      checkMadcat(current, true, true);',
              '      checkMadcat(current, true, madcatRetryNeedsAuth(state, message));',
              'master retry action'
          )
          path.write_text(text, encoding='utf-8')

          # FC-Lite uses the same MADCAT core and had the same "every error = auth"
          # retry behaviour, so keep the shared behaviour consistent there too.
          path = Path('FC_Lite.user.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '// @version      0.1.66', '// @version      0.1.67', 'fclite metadata version')
          text = replace_once(text, "const VERSION = '0.1.66';", "const VERSION = '0.1.67';", 'fclite runtime version')
          text = replace_once(text, '  function paintMadcat(row, state, message = \'\') {\n', helper + "  function paintMadcat(row, state, message = '') {\n", 'fclite retry helper')
          text = replace_once(
              text,
              "                ? `${message || 'MADCAT check failed'} — click to refresh auth and retry`",
              "                ? `${message || 'MADCAT check failed'} — click to ${madcatRetryNeedsAuth(value, message) ? 'refresh auth and retry' : 'retry'}`",
              'fclite error title'
          )
          text = replace_once(
              text,
              '        checkMadcat(row, fnsku, asin, true, Boolean(measurementId));',
              '        checkMadcat(row, fnsku, asin, true, Boolean(measurementId) && madcatRetryNeedsAuth(value, message));',
              'fclite retry action'
          )
          path.write_text(text, encoding='utf-8')

          # Fleet manifest versions.
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, '| FCR Data Core | 0.2.20 |', '| FCR Data Core | 0.2.21 |', 'readme core')
          text = replace_once(text, '| FCResearch Master | 0.1.28 |', '| FCResearch Master | 0.1.29 |', 'readme master')
          text = replace_once(text, '| FC-Lite | 0.1.66 |', '| FC-Lite | 0.1.67 |', 'readme fclite')
          path.write_text(text, encoding='utf-8')
          PY

          node --check FCR_Data_Core.user.js
          node --check FCResearch_Master.user.js
          node --check FC_Lite.user.js
          grep -q '@version      0.2.21' FCR_Data_Core.user.js
          grep -q '@version      0.1.29' FCResearch_Master.user.js
          grep -q '@version      0.1.67' FC_Lite.user.js
          grep -q 'MEASUREMENT_TIMEOUT_MS = 10000' FCR_Data_Core.user.js
          grep -q 'MEASUREMENT_RENEW_BEFORE_MS = 15 \* 1000' FCR_Data_Core.user.js
          ! grep -q '^  installMeasurementAutoRenewal();$' FCR_Data_Core.user.js
          grep -q 'madcatRetryNeedsAuth(state, message)' FCResearch_Master.user.js
          grep -q 'madcatRetryNeedsAuth(value, message)' FC_Lite.user.js
          git diff --check

          git add FCR_Data_Core.user.js FCResearch_Master.user.js FC_Lite.user.js README.md
          git rm .github/workflows/fix-madcat-auth-focus-once.yml
          git diff --cached --check
          git commit -m "fix: stop unnecessary MADCAT auth popups"
          git push origin HEAD:main

          main_short="$(git rev-parse --short HEAD)"
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b madcat-auth-focus-pack-sync "$worktree" origin/work-laptop-pack
          cp FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          cp FCResearch_Master.user.js "$worktree/04_FCResearch_Master.txt"
          cp FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          sed -i -E 's/^03 FCR Data Core v.*/03 FCR Data Core v0.2.21/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E 's/^04 FCResearch Master v.*/04 FCResearch Master v0.1.29/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E 's/^05 FC-Lite v.*/05 FC-Lite v0.1.67/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          sed -i -E "s/^Updater-enabled sources: main [0-9a-f]+\.$/Updater-enabled sources: main ${main_short}./" "$worktree/WORK_LAPTOP_INSTALL.txt"

          cmp -s FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          cmp -s FCResearch_Master.user.js "$worktree/04_FCResearch_Master.txt"
          cmp -s FC_Lite.user.js "$worktree/05_FC-Lite.txt"
          node --check "$worktree/03_FCR_Data_Core.txt"
          node --check "$worktree/04_FCResearch_Master.txt"
          node --check "$worktree/05_FC-Lite.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 03_FCR_Data_Core.txt 04_FCResearch_Master.txt 05_FC-Lite.txt WORK_LAPTOP_INSTALL.txt
          if ! git -C "$worktree" diff --cached --quiet; then
            git -C "$worktree" commit -m "chore: sync MADCAT auth focus fix to work laptop pack"
            git -C "$worktree" push origin HEAD:work-laptop-pack
          fi
