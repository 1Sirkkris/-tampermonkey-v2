name: one-shot stable titles and runtime version stamps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fleet-stable-titles-runtime-version-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch 16 active scripts
        shell: bash
        run: |
          python3 -c "import base64;exec(compile(base64.b64decode(''),'<fleet-version-patch>','exec'))"
          node --check AFT_Edit_SKU_Move.user.js
          node --check Sideline_API_Move.user.js
          node --check FNSKU_Mapping_Lookup.user.js
          node --check FC_Lite.user.js
          node --check FCR_Data_Core.user.js
          node --check FCResearch_Master.user.js
          node --check FCResearch_RIVER_Ticket_Assistant.user.js
          node --check Diagnostics/Amazon_ASIN_Variation_Finder_TEST.user.js
          node --check Calm_Code.user.js
          node --check Unbind_Hierarchy_Queue.user.js
          node --check BWU2_Observability_Core.user.js
          node --check Dropzone_Selector_Queue.user.js
          node --check Bin_Check_Overlay.user.js
          node --check Stow_Andons_Helper.user.js
          node --check SIM_Markdown_Toolbar.user.js
          node --check Carton_PrEditor.user.js
          git diff --check

      - name: Publish main and sync existing work laptop pack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/fleet-stable-titles-runtime-version-once.yml
          git add -A
          git commit -m "ui: stabilize script titles and expose runtime versions"
          git push origin main

          git fetch origin work-laptop-pack
          git switch work-laptop-pack
          git show main:Sideline_API_Move.user.js > 01_Sideline.txt
          git show main:AFT_Edit_SKU_Move.user.js > 02_AFT_Edit-SKU-Move.txt
          git show main:FCR_Data_Core.user.js > 03_FCR_Data_Core.txt
          git show main:FCResearch_Master.user.js > 04_FCResearch_Master.txt
          git show main:FC_Lite.user.js > 05_FC-Lite.txt
          git show main:Stow_Andons_Helper.user.js > 06_Stow_Andons.txt
          git show main:Bin_Check_Overlay.user.js > 07_Bin_Check_Overlay.txt
          git show main:Dropzone_Selector_Queue.user.js > 08_Dropzone_Queue.txt
          git show main:BWU2_Observability_Core.user.js > 10_BWU2_Observability_Core.txt
          git show main:Calm_Code.user.js > 11_Calm_Code.txt
          python3 -c "import base64;open('WORK_LAPTOP_INSTALL.txt','wb').write(base64.b64decode(''))"
          node --check 01_Sideline.txt
          node --check 02_AFT_Edit-SKU-Move.txt
          node --check 03_FCR_Data_Core.txt
          node --check 04_FCResearch_Master.txt
          node --check 05_FC-Lite.txt
          node --check 06_Stow_Andons.txt
          node --check 07_Bin_Check_Overlay.txt
          node --check 08_Dropzone_Queue.txt
          node --check 10_BWU2_Observability_Core.txt
          node --check 11_Calm_Code.txt
          grep -q 'Sideline v0.3.17' WORK_LAPTOP_INSTALL.txt
          grep -q 'AFT Edit-SKU-Move v0.9.20' WORK_LAPTOP_INSTALL.txt
          grep -q 'BWU2 Observability Core v0.1.12' WORK_LAPTOP_INSTALL.txt
          git add 01_Sideline.txt 02_AFT_Edit-SKU-Move.txt 03_FCR_Data_Core.txt 04_FCResearch_Master.txt 05_FC-Lite.txt 06_Stow_Andons.txt 07_Bin_Check_Overlay.txt 08_Dropzone_Queue.txt 10_BWU2_Observability_Core.txt 11_Calm_Code.txt WORK_LAPTOP_INSTALL.txt
          git commit -m "deploy: sync stable-title runtime-version fleet" || true
          git push origin work-laptop-pack
