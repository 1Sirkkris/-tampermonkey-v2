name: One-shot MADCAT auth diagnostics

on:
  push:
    paths:
      - '.github/workflows/one-shot-madcat-auth-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/one-shot-madcat-auth-diagnostics.py
      - name: Validate
        run: |
          node --check FCR_Data_Core.user.js
          node --check BWU2_Observability_Core.user.js
          git diff --check
          grep -q "@version      0.2.22" FCR_Data_Core.user.js
          grep -q "@version      0.1.13" BWU2_Observability_Core.user.js
          grep -q "fcr.madcat.auth-status" BWU2_Observability_Core.user.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-madcat-auth-diagnostics.yml .github/scripts/one-shot-madcat-auth-diagnostics.py
          git add FCR_Data_Core.user.js BWU2_Observability_Core.user.js README.md
          git diff --cached --check
          git commit -m "diag: record MADCAT auth lifetime safely"
          git push origin HEAD:main
