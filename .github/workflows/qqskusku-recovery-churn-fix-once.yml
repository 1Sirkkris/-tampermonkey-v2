name: one-shot QQSkuSku recovery churn fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qqskusku-recovery-churn-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/qqskusku-recovery-churn-patch.py
          node --check AFT_Edit_SKU_Move.user.js
          grep -q '@version      0.9.22' AFT_Edit_SKU_Move.user.js
          grep -q "const VERSION = '0.9.22';" AFT_Edit_SKU_Move.user.js
          grep -q "restoreSkuBatchReady({ oldObjectId: objectId, timeout: 30000 })" AFT_Edit_SKU_Move.user.js
          grep -q "restoreSkuBatchReady({ endCurrent: true, timeout: 30000 })" AFT_Edit_SKU_Move.user.js
          git diff --check
      - name: Publish main and sync pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp AFT_Edit_SKU_Move.user.js /tmp/AFT_Edit_SKU_Move.user.js
          rm .github/workflows/qqskusku-recovery-churn-fix-once.yml .github/qqskusku-recovery-churn-patch.py
          git add -A
          git commit -m "fix: stop QQSkuSku recovery task churn"
          git push origin main
          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b qqskusku-recovery-pack-sync "$worktree" origin/work-laptop-pack
          cp /tmp/AFT_Edit_SKU_Move.user.js "$worktree/02_AFT_Edit-SKU-Move.txt"
          sed -i -E 's/^02 AFT Edit-SKU-Move v.*/02 AFT Edit-SKU-Move v0.9.22/' "$worktree/WORK_LAPTOP_INSTALL.txt"
          cp "$worktree/02_AFT_Edit-SKU-Move.txt" /tmp/check-aft.js
          node --check /tmp/check-aft.js
          grep -q '@version      0.9.22' "$worktree/02_AFT_Edit-SKU-Move.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 02_AFT_Edit-SKU-Move.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "deploy: sync AFT v0.9.22" || true
          git -C "$worktree" push origin HEAD:work-laptop-pack
