name: stage-aft-v0.9.25

on:
  push:
    branches:
      - agent-aft-v0.9.25-stage
    paths:
      - .github/workflows/stage-aft-v0.9.25.yml

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate exact AFT candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .aft-stage/patch.part0 .aft-stage/patch.part1 .aft-stage/patch.part2a .aft-stage/patch.part2b | base64 -d > /tmp/aft-v0.9.25.patch
          test "$(sha256sum /tmp/aft-v0.9.25.patch | awk '{print $1}')" = "a11cbc9c5f4acde2a644fc7eefed67ddefa155c14b5d7037b107cec18bcd2bb2"
          git apply --check /tmp/aft-v0.9.25.patch
          git apply /tmp/aft-v0.9.25.patch
          node --check AFT_Edit_SKU_Move.user.js
          test "$(git hash-object AFT_Edit_SKU_Move.user.js)" = "c20ce56e78bedd61d33553269e4bc1fe98895ab1"
          grep -Fq '// @name         MAIN v0.9.17 AFT Edit/SKU/Move master' AFT_Edit_SKU_Move.user.js
          grep -Fq '// @namespace    https://github.com/1Sirkkris' AFT_Edit_SKU_Move.user.js
          grep -Fq '// @version      0.9.25' AFT_Edit_SKU_Move.user.js
          grep -Fq "const VERSION = '0.9.25';" AFT_Edit_SKU_Move.user.js
          grep -Fq '// @updateURL    https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js' AFT_Edit_SKU_Move.user.js
          grep -Fq '// @downloadURL  https://raw.githubusercontent.com/1Sirkkris/-tampermonkey-v2/main/AFT_Edit_SKU_Move.user.js' AFT_Edit_SKU_Move.user.js

      - name: Commit validated candidate to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AFT_Edit_SKU_Move.user.js
          git rm -r .aft-stage .github/workflows/stage-aft-v0.9.25.yml
          git commit -m "stage: validate AFT v0.9.25 mode merge"
          git push origin HEAD:agent-aft-v0.9.25-stage
