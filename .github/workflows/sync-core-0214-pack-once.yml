name: Sync Core 0.2.14 pack once

on:
  push:
    paths:
      - '.github/workflows/sync-core-0214-pack-once.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Core to work-laptop pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          grep -q '@version      0.2.14' FCR_Data_Core.user.js
          grep -q 'history-fallback-auth' FCR_Data_Core.user.js
          node --check FCR_Data_Core.user.js

          git fetch origin work-laptop-pack
          worktree="$(mktemp -d)"
          git worktree add -b core-0214-pack-sync "$worktree" origin/work-laptop-pack
          cp FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          PACK="$worktree/WORK_LAPTOP_INSTALL.txt" python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PACK'])
          s = p.read_text()
          old = '03 FCR Data Core v0.2.11'
          if old not in s:
              raise SystemExit('pack manifest Core row not found')
          p.write_text(s.replace(old, '03 FCR Data Core v0.2.14', 1))
          PY
          cmp -s FCR_Data_Core.user.js "$worktree/03_FCR_Data_Core.txt"
          grep -q '@version      0.2.14' "$worktree/03_FCR_Data_Core.txt"
          git -C "$worktree" diff --check
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add 03_FCR_Data_Core.txt WORK_LAPTOP_INSTALL.txt
          git -C "$worktree" commit -m "sync: FCR Data Core v0.2.14"
          git -C "$worktree" push origin HEAD:work-laptop-pack

          git rm .github/workflows/sync-core-0214-pack-once.yml
          git commit -m "ci: remove one-shot Core pack sync"
          git push origin HEAD:main
