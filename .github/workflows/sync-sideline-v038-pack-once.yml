name: Sync Sideline v0.3.8 pack once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-sideline-v038-pack-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync exact canonical file to pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main work-laptop-pack
          test "$(git hash-object origin/main:Sideline_API_Move.user.js 2>/dev/null || true)" = "" || true
          MAIN_FILE="$(mktemp --suffix=.js)"
          git show origin/main:Sideline_API_Move.user.js > "$MAIN_FILE"
          test "$(git hash-object "$MAIN_FILE")" = "8a4b9dbe80dc351fee34904f38c7f930e587e3d2"
          grep -q "@version      0.3.8" "$MAIN_FILE"
          node --check "$MAIN_FILE"

          git checkout -B work-laptop-pack origin/work-laptop-pack
          test "$(git hash-object 01_Sideline.txt)" = "b4c7f7a348b6fcef84bbaec2e7e2e9972251a27f"
          cp "$MAIN_FILE" 01_Sideline.txt
          cmp -s "$MAIN_FILE" 01_Sideline.txt
          cp 01_Sideline.txt /tmp/01_Sideline.js
          node --check /tmp/01_Sideline.js
          git add 01_Sideline.txt
          git commit -m "sync: Sideline API Move v0.3.8"
          git push origin HEAD:work-laptop-pack

      - name: Remove one-time sync workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          rm .github/workflows/sync-sideline-v038-pack-once.yml
          git add .github/workflows/sync-sideline-v038-pack-once.yml
          git commit -m "chore: remove Sideline v0.3.8 pack sync"
          git push origin HEAD:main
