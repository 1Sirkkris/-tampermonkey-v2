name: V3 Ground-up Build

on:
  push:
    branches: [v3-groundup]
    paths:
      - "v3/**"
      - ".github/workflows/v3-groundup-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-groundup-build
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-groundup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build V3
        working-directory: v3
        run: npm run build

      - name: Verify V3
        working-directory: v3
        run: npm run verify

      - name: Commit generated dist
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- v3/dist; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/dist
          git commit -m "V3 ground-up: rebuild dist [skip ci]"
          git push origin HEAD:v3-groundup
